function ehCozinha(id){const p=db.produtos.find(x=>x.id===id);return p?p.cozinha!==false:true;}
function itensPendentesCozinha(lista){
  return (lista||[]).filter(i=>ehCozinha(i.id)&&(i.qtd-(i.env||0))>0)
    .map(i=>({id:i.id,nome:i.nome,qtd:r2(i.qtd-(i.env||0)),obs:i.obs||'',preco:i.preco}));
}
function marcarEnviados(lista){(lista||[]).forEach(i=>{if(ehCozinha(i.id))i.env=i.qtd;});}
function enviarParaCozinha(rotulo,mesaId,itens,origem){
  if(!cozinhaOn()||!itens||!itens.length||!currentUser) return false;
  colPedidos().add({tipo:'pedido',mesaId:mesaId||null,mesaNome:rotulo||'Pedido',
    itens:itens.map(i=>({id:i.id,nome:i.nome,qtd:i.qtd,obs:i.obs||'',preco:i.preco||0})),
    origem:origem||'caixa',garcom:db.vendedor||'',status:'lancado',impresso:false,ts:Date.now()})
    .catch(e=>{console.error(e);toast('Falha ao enviar à cozinha (sem internet?)','bad');});
  return true;
}
function enviarMesaCozinha(){
  if(!mesaAtual) return;

  if(!pend.length){toast('Nada novo para a cozinha');return;}

  marcarEnviados(cart);syncMesa();renderBalcao();toast('Pedido enviado à cozinha','good');
}
function ticketCozinhaHTML(p){
  const itens=(p.itens||[]).filter(i=>ehCozinha(i.id));
  if(!itens.length) return null;
  const org=p.origem==='qr'?'QR Code':p.origem==='garcom'?('Garçom '+esc(p.garcom||'')):'Caixa';
  return `<div class="ticket"><h1>${esc(p.mesaNome||'PEDIDO')}</h1>
    <div class="tk-sub">COZINHA · ${horaDe(p.ts)} · ${org}</div>${p.cliente?`<div class="tk-sub">Cliente: ${esc(p.cliente)}</div>`:''}<hr>
    ${itens.map(i=>`<div class="tk-it">${i.qtd} x ${esc(i.nome)}</div>${i.obs?`<div class="tk-obs">» ${esc(i.obs)}</div>`:''}`).join('')}

}
function imprimirTicket(html){
  if(!html) return;
  let st=document.getElementById('pageTicket');
  if(!st){st=document.createElement('style');st.id='pageTicket';document.head.appendChild(st);}
  st.textContent='@page{margin:0}';
  doPrint(html);
  setTimeout(()=>{st.textContent='';},1500);
}
let filaImp=[], imprimindo=false, impUnsub=null; const enfileirados=new Set();
function iniciarImpressoraCozinha(){
  if(impUnsub) return;
  impUnsub=colPedidos().where('impresso','==',false).onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{
      if(ch.type==='removed') return;
      const p=ch.doc.data();
      if(['aprovado','lancado'].includes(p.status)&&!enfileirados.has(ch.doc.id)){enfileirados.add(ch.doc.id);filaImp.push(ch.doc.ref);}
    });
    processarFilaImp();
  },err=>console.error('impressora cozinha',err));
  unsubs.push(impUnsub);
}
function pararImpressoraCozinha(){if(impUnsub){try{impUnsub()}catch(e){}unsubs=unsubs.filter(u=>u!==impUnsub);impUnsub=null;}}
async function processarFilaImp(){
  if(imprimindo) return; imprimindo=true;
  while(filaImp.length){
    const ref=filaImp.shift();
    try{
      const p=await fsdb.runTransaction(async t=>{
        const d=await t.get(ref);
        if(!d.exists||d.data().impresso) return null;
        t.update(ref,{impresso:true,impressoEm:Date.now(),impressoPor:DEVICE_ID});
        return d.data();
      });
      if(p){const h=ticketCozinhaHTML(p);if(h){if(MODO==='cozinha')beep(1);imprimirTicket(h);await new Promise(r=>setTimeout(r,1500));}}
    }catch(e){console.error('falha na impressão',e);enfileirados.delete(ref.id);}
  }
  imprimindo=false;
}
function testeImpressao(){
  imprimirTicket(ticketCozinhaHTML({mesaNome:'TESTE',ts:Date.now(),origem:'caixa',itens:[{id:'__teste',nome:'Teste de impressão',qtd:1,obs:'Se saiu no papel, está funcionando'}]}));
}

let pedidosPend=[]; const pedidosVistos=new Set(); const lancando=new Set();
function iniciarPedidosCaixa(){
  const u=colPedidos().where('status','in',['aguardando','aprovado','chamado']).onSnapshot(snap=>{
    pedidosPend=[];
    snap.forEach(doc=>{
      const p={...doc.data(),_id:doc.id};
      if(p.status==='aprovado'&&(p.tipo||'pedido')==='pedido'){lancarPedido(doc.ref);return;}
      if(p.status==='aguardando'&&!db.config.qrAprovacao){doc.ref.update({status:'aprovado',aprovadoEm:Date.now()}).catch(()=>{});return;}
      if(p.tipo==='conta') marcarContaPedida(p);
      pedidosPend.push(p);
      if(!pedidosVistos.has(doc.id)){pedidosVistos.add(doc.id);avisarPedido(p);}
    });
    atualizarBadge();
    if($('#preVendasLista')) renderPreVendasLista();
    if(current==='mesas'&&!$('#modal').innerHTML) renderMesas();
  },err=>console.error('pedidos',err));
  unsubs.push(u);
}
function lancarPedido(ref){
  if(lancando.has(ref.id)) return; lancando.add(ref.id);
  fsdb.runTransaction(async t=>{
    const d=await t.get(ref);
    if(!d.exists||d.data().status!=='aprovado') return null;
    t.update(ref,{status:'lancado',lancadoEm:Date.now(),lancadoPor:DEVICE_ID});
    return d.data();
  }).then(p=>{if(p)aplicarPedidoNaMesa(p);}).catch(e=>{console.error(e);lancando.delete(ref.id);});
}
function aplicarPedidoNaMesa(p){
  const m=(db.mesas||[]).find(x=>x.id===p.mesaId);
  if(!m){toast('Pedido para mesa inexistente ('+(p.mesaNome||'?')+')','bad');return;}
  const itens=(p.itens||[]).map(it=>{
    const prod=db.produtos.find(x=>x.id===it.id); if(!prod) return null;
    const q=Math.max(0,Math.min(99,Number(it.qtd)||0)); if(!q) return null;
    return {id:prod.id,nome:prod.nome,preco:prod.preco,qtd:q,obs:String(it.obs||'').slice(0,140),env:q,orig:p.origem};
  }).filter(Boolean);
  if(!itens.length) return;
  if(mesaAtual===m.id){cart.push(...itens);syncMesa();if(current==='balcao')renderBalcao();}
  else{m.comanda=(m.comanda||[]).concat(itens);m.aberta=true;if(!m.abertaEm)m.abertaEm=Date.now();store.save();}
  if(current==='mesas'&&!$('#modal').innerHTML) renderMesas();
  if(current==='home') renderHome();
  toast(`${p.origem==='qr'?'Pedido QR':'Garçom'} · ${m.nome}: ${itens.reduce((s,i)=>s+i.qtd,0)} item(s) lançados na comanda`,'good');
}
function marcarContaPedida(p){
  const m=(db.mesas||[]).find(x=>x.id===p.mesaId);
  if(m&&!m.contaPedida){m.contaPedida=true;store.save();}
}
function avisarPedido(p){
  beep(p.status==='aguardando'?3:2);
  const msg=p.tipo==='chamado'?`${p.mesaNome} está chamando o garçom`:p.tipo==='conta'?`${p.mesaNome} pediu a conta`:`Novo pedido pelo QR · ${p.mesaNome} — F9 para aprovar`;
  toast('🔔 '+msg,'bad');
}

/* =====================================================================
   4) NFC-e — preparação do documento e fila de emissão
   ===================================================================== */
function montarNFCe(v){
  const F=db.config.fiscal||{}; const erros=[];
  if(soDig(F.cnpj).length!==14) erros.push('CNPJ do emitente (Configurações › Nota fiscal)');
  if(!soDig(F.ie)) erros.push('Inscrição estadual do emitente');
  if(!F.razao) erros.push('Razão social do emitente');
  const itens=v.itens||[];
  if(!itens.length) erros.push('Venda sem itens detalhados');
  const bruto=r2(itens.reduce((s,i)=>s+i.preco*i.qtd,0));
  const taxa=v.taxa||0;
  let desc=r2(bruto+taxa-v.valor); if(desc<0) desc=0;
  let acum=0;
  const items=itens.map((i,ix)=>{
    const p=db.produtos.find(x=>x.id===i.id)||{};
    const ncm=soDig(p.ncm);
    if(ncm.length!==8) erros.push('NCM (8 dígitos) do produto "'+i.nome+'"');
    const vb=r2(i.preco*i.qtd);
    const d=ix===itens.length-1?r2(desc-acum):r2(bruto?desc*vb/bruto:0); acum=r2(acum+d);
    const un=(p.unidade||'un').toUpperCase();
    const it={numero_item:ix+1,codigo_produto:p.codigoBarras||String(i.id),descricao:i.nome,codigo_ncm:ncm,cfop:soDig(p.cfop)||'5102',
      unidade_comercial:un,quantidade_comercial:i.qtd,valor_unitario_comercial:i.preco,unidade_tributavel:un,quantidade_tributavel:i.qtd,
      valor_unitario_tributavel:i.preco,valor_bruto:vb,icms_origem:0,icms_situacao_tributaria:p.csosn||'102',
      pis_situacao_tributaria:'49',cofins_situacao_tributaria:'49'};
    if(d>0) it.valor_desconto=d;
    if(ix===0&&taxa>0) it.valor_outras_despesas=r2(taxa);
    return it;
  });
  const formas={dinheiro:'01',credito:'03',debito:'04',pix:'17',fiado:'05'};
  const payload={natureza_operacao:'VENDA AO CONSUMIDOR',data_emissao:new Date(v.ts||Date.now()).toISOString(),tipo_documento:1,
    finalidade_emissao:1,consumidor_final:1,presenca_comprador:1,modalidade_frete:9,local_destino:1,cnpj_emitente:soDig(F.cnpj),
    items,formas_pagamento:[{forma_pagamento:formas[v.metodo]||'99',valor_pagamento:r2(v.valor)}]};
  const doc=soDig(v.cpf);
  if(doc.length===11) payload.cpf_destinatario=doc; else if(doc.length===14) payload.cnpj_destinatario=doc;
  return {erros:[...new Set(erros)],payload};
}
function enfileirarNFCe(v,silencioso){
  if(!v||v.cancelada) return;
  const r=montarNFCe(v);
  if(r.erros.length){
    if(silencioso){toast('NFC-e não preparada: falta '+r.erros[0],'bad');return;}
    openModal('NFC-e · faltam dados',`<p style="color:var(--muted);margin-top:0">Complete antes de emitir:</p><ul style="line-height:1.7">${r.erros.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`,null,
      `<button class="cancel" onclick="closeModal()">Fechar</button><button class="ok" onclick="closeModal();abrirFiscal()">Dados do emitente</button>`);
    return;
  }
  const F=db.config.fiscal; const numero=F.proximoNumero++;
  const reg={vendaCodigo:v.codigo,vendaNumero:v.numero,numero,serie:F.serie,ambiente:F.ambiente,provedor:'focusnfe',status:'aguardando_integracao',criadoEm:Date.now(),payload:r.payload};
  fsdb.collection('empresas').doc(currentUser.uid).collection('nfce').doc(String(v.codigo)).set(JSON.parse(JSON.stringify(reg))).catch(e=>console.error(e));
  v.fiscal='Na fila'; v.nfce={numero,serie:F.serie,status:'aguardando_integracao'};
  store.save(); if(current==='vendas') renderVendas();
  if(!silencioso) toast('NFC-e nº '+numero+' preparada e na fila de emissão','good');
}

async function exportarFilaNFCe(){
  try{
    const s=await fsdb.collection('empresas').doc(currentUser.uid).collection('nfce').get();
    const arr=[];s.forEach(d=>arr.push({id:d.id,...d.data()}));
    const blob=new Blob([JSON.stringify(arr,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fila-nfce-'+hoje().replace(/\//g,'-')+'.json';a.click();
    toast(arr.length+' NFC-e exportada(s)','good');
  }catch(e){toast('Erro ao exportar a fila','bad');}
}

let auxPronto=false;
function auxEl(){document.body.classList.add('aux-mode');const a=document.getElementById('authContainer');a.style.display='block';document.getElementById('appContainer').style.display='none';return a;}
function iniciarModoAuxiliar(){
  auxPronto=false;
  showLoading(MODO==='garcom'?'Abrindo modo garçom…':'Abrindo estação da cozinha…');
  const u=fsdb.collection('empresas').doc(currentUser.uid).onSnapshot(doc=>{
    try{db=migrate(doc.exists&&doc.data().dados?JSON.parse(doc.data().dados):db);}catch(e){console.error(e);}
    auxPronto=true; renderAux();
  },err=>{console.error(err);toast('Erro ao carregar os dados','bad');});
  unsubs.push(u);
  if(MODO==='garcom') iniciarPedidosGarcom();
  else{iniciarImpressoraCozinha();iniciarHistoricoCozinha();}
}
function renderAux(){if(!auxPronto||!currentUser)return;if(MODO==='garcom')renderGarcom();else if(MODO==='cozinha')renderCozinha();}
function auxPreservar(fn,resetar){
  const a=auxEl(); const sc=a.querySelector('.aux'); const top=sc?sc.scrollTop:0;
  const ae=document.activeElement; const aeId=ae&&ae.id&&a.contains(ae)?ae.id:null; let sel=null; try{sel=ae.selectionStart}catch(e){}
  a.innerHTML=fn();
  const sc2=a.querySelector('.aux'); if(sc2&&!resetar) sc2.scrollTop=top;
  if(aeId){const el=document.getElementById(aeId);if(el){el.focus();try{if(sel!==null)el.setSelectionRange(sel,sel);}catch(e){}}}
}
function sairModoAux(){
  openModal('Opções do aparelho',`

    ${MODO!=='cozinha'?`<button class="action-row" onclick="closeModal();trocarModoAparelho('cozinha')"><span class="al">Usar como Estação da Cozinha</span></button>`:''}
    ${MODO!=='garcom'?`<button class="action-row" onclick="closeModal();trocarModoAparelho('garcom')"><span class="al">Usar como Garçom</span></button>`:''}
    <button class="action-row" onclick="closeModal();doLogout()"><span class="al" style="color:var(--danger)">Sair da conta</span></button>`,null);

/* ---------- GARÇOM ---------- */
let gTela='mesas', gMesaId=null, gCart=[], gBusca='', gCat='', gCats=[], gPedidos=[], gInit=false, gReset=false;
function gNome(){return lsGet('rz_garcom')||'';}
function gTrocarNome(cb){
  openModal('Nome do garçom',`<input class="finput" id="gNomeIn" value="${esc(gNome())}" placeholder="Seu nome">`,()=>{
    const n=$('#gNomeIn').value.trim(); if(!n){toast('Informe seu nome','bad');return false;}
    lsSet('rz_garcom',n.slice(0,30)); renderAux(); if(typeof cb==='function') setTimeout(cb,60);
  });
}
function iniciarPedidosGarcom(){
  const u=colPedidos().where('status','in',['aguardando','aprovado','chamado']).onSnapshot(s=>{
    const novos=[];s.forEach(d=>novos.push({...d.data(),_id:d.id}));
    const antes=new Set(gPedidos.map(p=>p._id));
    if(gInit&&novos.some(p=>!antes.has(p._id)&&(p.status==='aguardando'||p.status==='chamado'))){beep(2);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
    gPedidos=novos; gInit=true; renderAux();
  },err=>console.error(err));
  unsubs.push(u);
}
function gAlertasHTML(){
  return gPedidos.filter(p=>p.status==='aguardando'||p.status==='chamado').sort((a,b)=>a.ts-b.ts).map(p=>{
    const t=p.tipo==='chamado'?'está chamando':p.tipo==='conta'?'pediu a conta':'fez pedido pelo QR ('+(p.itens||[]).reduce((s,i)=>s+i.qtd,0)+' itens)';
    const btn=p.status==='aguardando'?`<button class="btn pri" onclick="gVerQR('${p._id}')">Ver</button>`:`<button class="btn gho" onclick="atenderChamado('${p._id}')">OK</button>`;
    return `<div class="alert-row"><div class="grow"><b>${esc(p.mesaNome||'')}</b> ${t}${p.cliente?' · '+esc(p.cliente):''}<div style="color:var(--faint);font-size:12px">${horaDe(p.ts)}</div></div>${btn}</div>`;
  }).join('');
}
function gVerQR(id){
  const p=gPedidos.find(x=>x._id===id); if(!p) return;
  openModal('Pedido QR · '+esc(p.mesaNome||''),(p.cliente?`<div style="color:var(--muted);margin-bottom:6px">Cliente: ${esc(p.cliente)}</div>`:'')
    +(p.itens||[]).map(i=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${i.qtd}x</b> ${esc(i.nome)}${i.obs?`<div style="color:var(--accent);font-size:13px">${esc(i.obs)}</div>`:''}</div>`).join(''),null,
    `<button class="cancel" style="color:var(--danger)" onclick="recusarPedido('${id}');closeModal()">Recusar</button><button class="ok" onclick="aprovarPedido('${id}');closeModal()">Aprovar e enviar</button>`);
}
function gTotalMesa(m){return (m.comanda||[]).reduce((s,i)=>s+i.preco*i.qtd,0);}
function renderGarcom(){const r=gReset;gReset=false;auxPreservar(()=>gTela==='mesa'?gMesaHTML():gMesasHTML(),r);}
function gTopo(titulo,esq,dir){return `<div class="aux-top">${esq||`<span class="sg">${esc(db.config.sigla||'RZ')}</span>`}<div class="ttl">${titulo}</div>${dir||''}</div>`;}
function gMesasHTML(){
  const mesas=db.mesas||[];
  return `<div class="aux">${gTopo(esc(db.config.nomeLoja)+' · Garçom','',`<button class="btn gho" onclick="sairModoAux()">${esc(gNome()||'Opções')} ⋯</button>`)}
  <div class="aux-body">${gAlertasHTML()}
    ${mesas.length?`<div class="mesa-grid">${mesas.map(m=>{
      const oc=(m.comanda||[]).length>0; const env=gPedidos.filter(p=>p.mesaId===m.id&&p.status==='aprovado').length;
      const min=m.abertaEm?Math.floor((Date.now()-m.abertaEm)/60000):0;
      return `<div class="mesa-card ${oc||env?'ocup':'livre'}" onclick="gAbrirMesa('${m.id}')"><div style="font-weight:800;font-size:17px">${esc(m.nome)}</div>
        <div style="margin-top:auto">${oc?`<div class="mono" style="font-size:19px;font-weight:800;color:#ef8f3c">${money(gTotalMesa(m))}</div><div style="font-size:12px;color:var(--muted)">há ${min} min</div>`:`<div style="color:var(--money);font-weight:700">Livre</div>`}
        ${m.contaPedida?'<span class="mtag conta">CONTA</span>':''}${env?'<span class="mtag qr">enviando…</span>':''}</div></div>`;}).join('')}</div>`
    :`<div class="ent-card" style="text-align:center;color:var(--muted)">Nenhuma mesa cadastrada. Cadastre as mesas no caixa (Configurações › Mesas).</div>`}
  </div></div>`;
}
function gAbrirMesa(id){gMesaId=id;gTela='mesa';gCart=[];gBusca='';gCat='';gReset=true;renderGarcom();}
function gVoltar(){
  const sai=()=>{gCart=[];gTela='mesas';gReset=true;renderGarcom();};
  if(gCart.length) confirmModal('Descartar pedido?','Os itens ainda não foram enviados.',sai); else sai();
}
function gMesaHTML(){
  const m=(db.mesas||[]).find(x=>x.id===gMesaId); if(!m){gTela='mesas';return gMesasHTML();}
  gCats=[...new Set(db.produtos.filter(p=>p.cardapio!==false).map(p=>p.categoria||'').filter(Boolean))].sort();
  const q=gBusca.toLowerCase();
  const prods=db.produtos.filter(p=>p.cardapio!==false&&(!gCat||p.categoria===gCat)&&p.nome.toLowerCase().includes(q));
  const enviando=gPedidos.filter(p=>p.mesaId===m.id&&p.status==='aprovado');
  const nCart=gCart.reduce((s,i)=>s+i.qtd,0), totCart=gCart.reduce((s,i)=>s+i.preco*i.qtd,0);
  const linha='display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px';
  return `<div class="aux">${gTopo(esc(m.nome),`<button class="back" onclick="gVoltar()" style="padding:6px 12px">‹ Mesas</button>`,`<div class="mono" style="font-weight:800;color:#ef8f3c">${money(gTotalMesa(m))}</div>`)}
  <div class="aux-body">${gAlertasHTML()}
    ${gCart.length?`<div class="sec-t">Novo pedido · ${nCart} item(s)</div><div class="card">${gCart.map((i,ix)=>`<div style="padding:10px 12px;border-bottom:1px solid var(--line)">
      <div style="display:flex;align-items:center;gap:10px"><div style="flex:1;font-weight:700">${esc(i.nome)}</div><div class="qtybox"><button onclick="gQtd(${ix},-1)">−</button><b class="mono">${i.qtd}</b><button onclick="gQtd(${ix},1)">+</button></div></div>
      <input class="finput" id="gobs${ix}" style="margin:8px 0 0;padding:9px 12px;font-size:14px" placeholder="Observação (sem cebola, bem passado…)" value="${esc(i.obs)}" oninput="gCart[${ix}].obs=this.value"></div>`).join('')}</div>`:''}
    <div class="sec-t">Cardápio</div>
    <input class="finput" id="gBuscaIn" placeholder="Buscar produto…" value="${esc(gBusca)}" oninput="gBusca=this.value;renderGarcom()">
    ${gCats.length?`<div class="cats"><button class="chip ${!gCat?'on':''}" onclick="gCat='';renderGarcom()">Todos</button>${gCats.map((c,ix)=>`<button class="chip ${gCat===c?'on':''}" onclick="gCat=gCats[${ix}];renderGarcom()">${esc(c)}</button>`).join('')}</div>`:''}
    <div class="card">${prods.map(p=>{const off=p.controla&&p.estoque<=0;const n=gCart.filter(i=>i.id===p.id).reduce((s,i)=>s+i.qtd,0);
      return `<div class="g-prod ${off?'off':''}" onclick="gAdd('${p.id}')"><div class="nm">${esc(p.nome)}${n?` <span class="mtag qr" style="margin:0">${n}</span>`:''}${off?'<div class="ds" style="color:var(--danger)">sem estoque</div>':''}</div><div class="pr mono">${money(p.preco)}</div><div class="add">+</div></div>`;}).join('')||'<div style="padding:14px;color:var(--faint)">Nenhum produto</div>'}</div>
    <div class="sec-t">Consumo da mesa</div>
    <div class="card">${(m.comanda||[]).map(i=>`<div style="${linha}"><div style="flex:1">${i.qtd}x ${esc(i.nome)}${i.obs?`<div style="color:var(--accent);font-size:12px">${esc(i.obs)}</div>`:''}</div><div class="mono">${money(i.preco*i.qtd)}</div></div>`).join('')}
      ${enviando.map(p=>(p.itens||[]).map(i=>`<div style="${linha};opacity:.6"><div style="flex:1">${i.qtd}x ${esc(i.nome)} <i style="font-size:11px">(lançando no caixa…)</i></div></div>`).join('')).join('')}
      ${!(m.comanda||[]).length&&!enviando.length?'<div style="padding:14px;color:var(--faint)">Mesa sem consumo ainda</div>':''}</div>
    <button class="btn gho" style="width:100%;margin-top:14px;padding:14px" ${m.contaPedida?'disabled':''} onclick="gPedirConta()">${m.contaPedida?'Conta já solicitada ao caixa':'Pedir a conta ao caixa'}</button>
  </div>
  <div class="sticky-bar"><button class="big" ${gCart.length?'':'disabled'} onclick="gEnviar()">Enviar pedido${gCart.length?` · ${nCart} item(s) · ${money(totCart)}`:''}</button></div></div>`;
}
function gAdd(id){
  const p=db.produtos.find(x=>x.id===id); if(!p) return;
  const ex=gCart.find(i=>i.id===id&&!i.obs);
  if(ex) ex.qtd++; else gCart.push({id:p.id,nome:p.nome,preco:p.preco,qtd:1,obs:''});
  renderGarcom(); toast('+1 '+p.nome);
}
function gQtd(ix,d){const i=gCart[ix];if(!i)return;i.qtd+=d;if(i.qtd<=0)gCart.splice(ix,1);renderGarcom();}
function gEnviar(){
  const m=(db.mesas||[]).find(x=>x.id===gMesaId); if(!m||!gCart.length) return;
  if(!gNome()){gTrocarNome(()=>gEnviar());return;}
  const itens=gCart.map(i=>({id:i.id,nome:i.nome,qtd:i.qtd,obs:(i.obs||'').trim(),preco:i.preco}));

let qrCard=null, qrCart=[], qrCat='', qrCats=[], qrTela='menu', qrNome='', qrCooldown=0, qrEnviados=[], qrEnviando=false;
async function iniciarQR(){
  const a=auxEl();
  a.innerHTML='<div class="loading-screen"><div class="spinner"></div>Abrindo cardápio…</div>';
  try{const d=await fsdb.collection('cardapios').doc(QR_LOJA).get();if(!d.exists)throw 0;qrCard=d.data();}
  catch(e){a.innerHTML='<div class="loading-screen" style="text-align:center;padding:20px">Cardápio indisponível no momento.<br>Por favor, chame o garçom 🙂</div>';return;}
  try{qrEnviados=JSON.parse(sessionStorage.getItem('rz_qr_'+QR_MESA)||'[]');}catch(e){qrEnviados=[];}
  try{qrNome=sessionStorage.getItem('rz_qr_nome')||'';}catch(e){}
  document.title=(qrCard.nome||'Cardápio');
  renderQR();
}
function qrMesa(){return (qrCard.mesas||[]).find(m=>m.id===QR_MESA);}
function qrHistHTML(){
  if(!qrEnviados.length) return '';
  return `<div class="sec-t" style="text-align:left">Já pedido nesta mesa</div><div class="card" style="text-align:left">${qrEnviados.map(e=>e.itens.map(i=>`<div style="padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px">${i.qtd}x ${esc(i.nome)} <span style="color:var(--faint);font-size:12px">· ${e.hora}</span></div>`).join('')).join('')}</div>`;
}
function renderQR(reset){
  const m=qrMesa();
  if(!m){auxEl().innerHTML='<div class="loading-screen" style="text-align:center;padding:20px">Este QR Code está desatualizado.<br>Por favor, chame o garçom 🙂</div>';return;}
  const nomeLoja=esc(qrCard.nome||'Cardápio');
  const prods=qrCard.produtos||[];
  const nCart=qrCart.reduce((s,i)=>s+i.qtd,0), tot=qrCart.reduce((s,i)=>s+i.preco*i.qtd,0);
  const topo=(esq)=>`<div class="aux-top">${esq||''}<div class="ttl">${nomeLoja}</div><span class="chip on" style="padding:6px 12px">${esc(m.nome)}</span></div>`;
  auxPreservar(()=>{
    if(qrTela==='ok') return `<div class="aux">${topo()}<div class="aux-body" style="text-align:center">
      <div style="width:70px;height:70px;border-radius:50%;background:var(--money);color:#04200f;display:grid;place-items:center;font-size:36px;margin:30px auto 0">✓</div>
      <div style="font-size:22px;font-weight:800;margin:14px 0 6px">Pedido enviado!</div>
      <div style="color:var(--muted)">${qrCard.aprovacao?'Um garçom vai confirmar seu pedido em instantes.':'Seu pedido já foi para a cozinha.'}</div>
      <button class="btn pri" style="margin-top:22px;padding:14px 24px" onclick="qrTela='menu';renderQR(true)">Pedir mais</button>
      ${qrHistHTML()}</div></div>`;
    if(qrTela==='cart') return `<div class="aux">${topo(`<button class="back" style="padding:6px 12px" onclick="qrTela='menu';renderQR(true)">‹ Cardápio</button>`)}<div class="aux-body">
      <div class="sec-t">Seu pedido</div>
      <div class="card">${qrCart.map((i,ix)=>`<div style="padding:10px 12px;border-bottom:1px solid var(--line)">
        <div style="display:flex;align-items:center;gap:10px"><div style="flex:1;font-weight:700">${esc(i.nome)}<div class="mono" style="color:var(--muted);font-size:12px;font-weight:600">${money(i.preco*i.qtd)}</div></div>
        <div class="qtybox"><button onclick="qrQtd(${ix},-1)">−</button><b class="mono">${i.qtd}</b><button onclick="qrQtd(${ix},1)">+</button></div></div>
        <input class="finput" id="qobs${ix}" maxlength="140" style="margin:8px 0 0;padding:9px 12px;font-size:14px" placeholder="Observação (opcional)" value="${esc(i.obs)}" oninput="qrCart[${ix}].obs=this.value"></div>`).join('')||'<div style="padding:14px;color:var(--faint)">Carrinho vazio</div>'}</div>
      <label class="fl" style="margin-top:14px">Seu nome (opcional)</label>
      <input class="finput" id="qrNomeIn" maxlength="40" value="${esc(qrNome)}" placeholder="Para o garçom te encontrar" oninput="qrNome=this.value">
      <div style="display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin-top:4px"><span>Total</span><span class="mono">${money(tot)}</span></div>
      <p style="color:var(--faint);font-size:12px">Valores conferidos pelo caixa no fechamento da conta.</p>
    </div><div class="sticky-bar"><button class="big" ${qrCart.length&&!qrEnviando?'':'disabled'} onclick="qrEnviar()">${qrEnviando?'Enviando…':'Enviar pedido'}</button></div></div>`;
    {const ord=qrCard.setores||[];qrCats=[...new Set(prods.map(p=>p.categoria).filter(Boolean))].sort((a,b)=>{const ia=ord.indexOf(a),ib=ord.indexOf(b);if(ia>=0&&ib>=0)return ia-ib;if(ia>=0)return -1;if(ib>=0)return 1;return a.localeCompare(b);});}
    const grupos=(qrCat?[qrCat]:[...qrCats,'']).map(c=>({c,ps:prods.filter(p=>(p.categoria||'')===c)})).filter(g=>g.ps.length);
    return `<div class="aux">${topo()}<div class="aux-body">
      <div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn gho" style="flex:1" onclick="qrChamar('chamado')">🙋 Chamar garçom</button><button class="btn gho" style="flex:1" onclick="qrChamar('conta')">🧾 Pedir a conta</button></div>
      ${qrCats.length?`<div class="cats"><button class="chip ${!qrCat?'on':''}" onclick="qrCat='';renderQR(true)">Todos</button>${qrCats.map((c,ix)=>`<button class="chip ${qrCat===c?'on':''}" onclick="qrCat=qrCats[${ix}];renderQR(true)">${esc(c)}</button>`).join('')}</div>`:''}
      ${grupos.map(g=>`<div class="sec-t">${esc(g.c||(qrCats.length?'Outros':'Cardápio'))}</div><div class="card">${g.ps.map(p=>{const n=qrCart.filter(i=>i.id===p.id).reduce((s,i)=>s+i.qtd,0);
        return `<div class="g-prod ${p.disp?'':'off'}" onclick="qrAdd('${p.id}')"><div class="nm">${esc(p.nome)}${n?` <span class="mtag qr" style="margin:0">${n}</span>`:''}${p.descricao?`<div class="ds">${esc(p.descricao)}</div>`:''}${p.disp?'':'<div class="ds" style="color:var(--danger)">indisponível</div>'}</div><div class="pr mono">${money(p.preco)}</div><div class="add">+</div></div>`;}).join('')}</div>`).join('')||'<div style="color:var(--faint);text-align:center;padding:30px">Cardápio vazio</div>'}
      ${qrHistHTML()}
    </div>${qrCart.length?`<div class="sticky-bar"><button class="big" onclick="qrTela='cart';renderQR(true)">Ver pedido · ${nCart} item(s) · ${money(tot)}</button></div>`:''}</div>`;
  },reset);
}
function qrAdd(id){
  const p=(qrCard.produtos||[]).find(x=>x.id===id); if(!p||!p.disp) return;
  const ex=qrCart.find(i=>i.id===id&&!i.obs);
  if(ex) ex.qtd=Math.min(20,ex.qtd+1); else qrCart.push({id:p.id,nome:p.nome,preco:p.preco,qtd:1,obs:''});
  renderQR(); toast('+1 '+p.nome);
}
function qrQtd(ix,d){const i=qrCart[ix];if(!i)return;i.qtd=Math.min(20,i.qtd+d);if(i.qtd<=0)qrCart.splice(ix,1);if(!qrCart.length)qrTela='menu';renderQR();}
async function qrEnviar(){
  const m=qrMesa(); if(!m||!qrCart.length||qrEnviando) return;
  qrEnviando=true; renderQR();
  const nome=(qrNome||'').trim().slice(0,40);
  try{sessionStorage.setItem('rz_qr_nome',nome);}catch(e){}
  const itens=qrCart.slice(0,40).map(i=>({id:i.id,nome:i.nome,qtd:i.qtd,obs:(i.obs||'').trim().slice(0,140),preco:i.preco}));
  try{
    await colPedidos(QR_LOJA).add({tipo:'pedido',mesaId:m.id,mesaNome:m.nome,itens,origem:'qr',cliente:nome,status:'aguardando',impresso:false,ts:Date.now()});
    qrEnviados.push({hora:horaDe(Date.now()),itens});
    try{sessionStorage.setItem('rz_qr_'+QR_MESA,JSON.stringify(qrEnviados));}catch(e){}
    qrCart=[]; qrTela='ok';
  }catch(e){console.error(e);toast('Não foi possível enviar. Tente de novo ou chame o garçom.','bad');}
  qrEnviando=false; renderQR(true);
}
async function qrChamar(tipo){
  if(Date.now()<qrCooldown){toast('Já avisamos! Aguarde um instante 🙂');return;}
  const m=qrMesa(); if(!m) return;
  qrCooldown=Date.now()+45000;
  try{
    await colPedidos(QR_LOJA).add({tipo,mesaId:m.id,mesaNome:m.nome,itens:[],origem:'qr',cliente:(qrNome||'').slice(0,40),status:'chamado',impresso:true,ts:Date.now()});
    toast(tipo==='conta'?'Pedimos a sua conta ✓':'Garçom chamado ✓','good');
  }catch(e){qrCooldown=0;toast('Não foi possível avisar. Tente novamente.','bad');}
}

const _migrate2=migrate;
migrate=function(d){
  d=_migrate2(d); if(!d) return d;
  const c=d.config;
  if(!c.home) c.home={};
  ['cliente','vendedor','credito','cadastro','vendas','fechamento','sangria'].forEach(k=>{if(c.home[k]===undefined)c.home[k]=true;});
  if(c.modulos.reservas===undefined) c.modulos.reservas=false;
  if(c.modulos.financeiro===undefined) c.modulos.financeiro=true;
  if(c.rotuloVendedor===undefined) c.rotuloVendedor='Vendedor';
  if(c.atrasoMin===undefined) c.atrasoMin=25;
  if(c.notifEstoque===undefined) c.notifEstoque=true;
  if(!d.equipe) d.equipe=[];
  if(!d.reservas) d.reservas=[];
  if(!d.lancamentos) d.lancamentos=[];
  (d.produtos||[]).forEach(p=>{if(p.custo===undefined)p.custo=0;});
  return d;
};

let resDia=null, resMes=null;
const RES_ST={confirmada:['Confirmada','var(--blue)'],chegou:['Chegou','var(--money)'],cancelada:['Cancelada','var(--faint)'],nao_veio:['Não veio','var(--danger)']};
function reservasDoDia(iso){return (db.reservas||[]).filter(r=>r.data===iso).sort((a,b)=>String(a.hora).localeCompare(String(b.hora)));}
function resTs(r){return new Date(r.data+'T'+(r.hora||'00:00')+':00').getTime();}
function mesaNomeId(id){const m=(db.mesas||[]).find(x=>x.id===id);return m?m.nome:'';}
function renderReservas(){
  if(!resDia) resDia=isoHoje(); if(!resMes) resMes=resDia.slice(0,7);
  const [Y,M]=resMes.split('-').map(Number);
  const startDow=(new Date(Y,M-1,1).getDay()+6)%7, nDias=new Date(Y,M,0).getDate(), hj=isoHoje();
  let cells=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startDow;i++) cells+='<div class="cal-d vazio"></div>';
  for(let d=1;d<=nDias;d++){
    const iso=resMes+'-'+String(d).padStart(2,'0');
    const rs=reservasDoDia(iso).filter(r=>r.status!=='cancelada');
    const pes=rs.reduce((s,r)=>s+(+r.pessoas||0),0);
    cells+=`<button class="cal-d ${iso===resDia?'sel':''} ${iso===hj?'hoje':''}" onclick="resDia='${iso}';renderReservas()"><span class="n">${d}</span>${rs.length?`<span class="cnt">${rs.length} · ${pes}p</span>`:''}</button>`;
  }
  const lista=reservasDoDia(resDia);
  const ativos=lista.filter(r=>r.status!=='cancelada');
  const dsem=DIAS_SEM[new Date(resDia+'T12:00:00').getDay()];
  view.innerHTML=`
  <div class="scr-head">
    <button class="back" onclick="go('home')">Voltar<small>ESC</small></button>
    <div class="scr-title">Reservas</div><div class="spacer"></div>
    <button class="btn pri" onclick="editReserva()">+ Nova reserva</button>
  </div>
  <div class="res-wrap">
    <div class="card" style="padding:14px">
      <div class="cal-head"><button class="btn gho" onclick="mudaMes(-1)">‹</button><div class="mes">${MESES[M-1]} ${Y}</div>
        <button class="btn gho" onclick="resDia=isoHoje();resMes=resDia.slice(0,7);renderReservas()">Hoje</button><button class="btn gho" onclick="mudaMes(1)">›</button></div>
      <div class="cal-grid">${cells}</div>
    </div>
    <div>
      <div class="sec-t" style="margin-top:0">${dsem}, ${brData(resDia)} · ${ativos.length} reserva(s) · ${ativos.reduce((s,r)=>s+(+r.pessoas||0),0)} pessoas</div>
      ${lista.map(resCardHTML).join('')||`<div class="ent-card" style="text-align:center;color:var(--muted)">Nenhuma reserva neste dia.<div style="margin-top:10px"><button class="btn pri" onclick="editReserva()">+ Nova reserva</button></div></div>`}
    </div>
  </div>`;
}
function mudaMes(d){const [Y,M]=resMes.split('-').map(Number);const nd=new Date(Y,M-1+d,1);resMes=isoData(nd).slice(0,7);renderReservas();}
function resCardHTML(r){
  const st=RES_ST[r.status]||RES_ST.confirmada;

  return `<div class="res-card" style="${r.status==='cancelada'?'opacity:.55':''}">
    <div style="display:flex;gap:14px;align-items:flex-start">

      <div style="flex:1;min-width:0"><div style="font-weight:800;font-size:16px">${esc(r.nome)}</div>
        <div style="color:var(--muted);font-size:13px">${+r.pessoas||0} pessoa(s)${mesa?' · '+esc(mesa):''}${r.telefone?' · '+esc(r.telefone):''}</div>
        ${r.obs?`<div style="color:var(--accent);font-size:13px;margin-top:3px">${esc(r.obs)}</div>`:''}</div>
      <span class="st-chip" style="color:${st[1]}">${st[0]}</span>
    </div>

      ${r.telefone?`<button class="btn gho" onclick="whatsReserva('${r.id}')">WhatsApp</button>`:''}
      ${r.status==='confirmada'?`<button class="btn gho" onclick="setStatusReserva('${r.id}','nao_veio')">Não veio</button><button class="btn gho" onclick="setStatusReserva('${r.id}','cancelada')">Cancelar</button>`

      <div style="flex:1;min-width:160px"><label class="fl">Mesa (opcional)</label><select class="sel" id="rsMesa"><option value="">— definir na chegada —</option>${(db.mesas||[]).map(m=>`<option value="${m.id}" ${r&&r.mesaId===m.id?'selected':''}>${esc(m.nome)}</option>`).join('')}</select></div>

    <label class="fl">Observação</label><input class="finput" id="rsObs" value="${r?esc(r.obs||''):''}" placeholder="Aniversário, cadeirinha, mesa na varanda…">

  `,()=>{

    if(!nome||!data||!hora){toast('Preencha nome, data e hora','bad');return false;}
    const dados={nome,data,hora,pessoas:Math.max(1,parseInt($('#rsPes').value)||1),telefone:$('#rsTel').value.trim(),mesaId:$('#rsMesa').value||null,obs:$('#rsObs').value.trim()};
    if(r&&$('#rsSt')) dados.status=$('#rsSt').value;
    if(dados.mesaId){
      const t=new Date(data+'T'+hora+':00').getTime();
      const choque=db.reservas.find(x=>x.id!==(r&&r.id)&&x.mesaId===dados.mesaId&&x.data===data&&x.status==='confirmada'&&Math.abs(resTs(x)-t)<2*3600e3);
      if(choque) setTimeout(()=>toast('Atenção: '+mesaNomeId(dados.mesaId)+' já tem reserva às '+choque.hora,'bad'),300);
    }
    if(r) Object.assign(r,dados); else db.reservas.push({id:uid(),status:'confirmada',criadaEm:Date.now(),...dados});
    resDia=data; resMes=data.slice(0,7);

/* =====================================================================
   4) NOTIFICAÇÕES — pedidos, atrasos, reservas e estoque

let kRecentes=[], notifVistos=new Set(), notifInit=false, notifTimer=null, ultNotifs=[];
function iniciarMonitor(){
  const u=colPedidos().where('ts','>',Date.now()-12*3600e3).onSnapshot(s=>{
    kRecentes=[];s.forEach(d=>{const p=d.data();if((p.tipo||'pedido')==='pedido')kRecentes.push({...p,_id:d.id});});
    checarNotificacoes();
  },err=>console.error('monitor',err));
  unsubs.push(u);
  if(!notifTimer) notifTimer=setInterval(checarNotificacoes,30000);
}
function atrasados(){
  const lim=(+db.config.atrasoMin||25)*60000;
  return kRecentes.filter(p=>['lancado','aprovado'].includes(p.status)&&!p.entregue&&(p.itens||[]).some(i=>ehCozinha(i.id))&&Date.now()-p.ts>lim);
}
function marcarEntregue(id,silencioso){
  colPedidos().doc(id).update({entregue:true,entregueEm:Date.now()}).catch(()=>{});
  const p=kRecentes.find(x=>x._id===id); if(p) p.entregue=true;
  if(!silencioso){toast('Pedido marcado como entregue','good');checarNotificacoes();if(MODO==='garcom')renderAux();}
}
function calcNotificacoes(){
  const n=[], agoraTs=Date.now();
  if(typeof pedidosPend!=='undefined') pedidosPend.forEach(p=>n.push({id:'p'+p._id,nivel:'critico',ic:'🔔',
    tit:p.tipo==='chamado'?`${p.mesaNome} está chamando o garçom`:p.tipo==='conta'?`${p.mesaNome} pediu a conta`:`Pedido pelo QR · ${p.mesaNome} aguardando aprovação`,
    txt:'às '+horaDe(p.ts),acao:`closeModal();abrirPreVendas()`,acaoTxt:'Abrir'}));
  atrasados().forEach(p=>{const min=Math.floor((agoraTs-p.ts)/60000);
    n.push({id:'a'+p._id,nivel:'critico',ic:'⏱',tit:`${p.mesaNome} · pedido em atraso (${min} min)`,
      txt:(p.itens||[]).filter(i=>ehCozinha(i.id)).map(i=>i.qtd+'x '+i.nome).join(', '),acao:`marcarEntregue('${p._id}')`,acaoTxt:'Entregue ✓'});});
  (db.reservas||[]).filter(r=>r.status==='confirmada').forEach(r=>{
    const dm=(resTs(r)-agoraTs)/60000, mesa=mesaNomeId(r.mesaId);
    const info=`${r.pessoas} pessoa(s)${mesa?' · '+mesa:''}${r.obs?' · '+r.obs:''}`;
    if(dm<=60&&dm>=-15) n.push({id:'r'+r.id,nivel:'info',ic:'📅',tit:`Reserva às ${r.hora} · ${r.nome}`,txt:info,acao:`setStatusReserva('${r.id}','chegou')`,acaoTxt:'Chegou ✓'});
    else if(dm<-15&&dm>-240) n.push({id:'rr'+r.id,nivel:'aviso',ic:'📅',tit:`Reserva das ${r.hora} · ${r.nome} ainda não chegou`,txt:info,acao:`setStatusReserva('${r.id}','nao_veio')`,acaoTxt:'Não veio'});
  });
  if(db.config.notifEstoque!==false){
    zerados().forEach(p=>n.push({id:'z'+p.id,nivel:'aviso',ic:'📦',tit:`Acabou: ${p.nome}`,txt:'Estoque zerado',acao:`closeModal();entradaRapida('${p.id}')`,acaoTxt:'Repor'}));
    baixos().forEach(p=>n.push({id:'b'+p.id,nivel:'info',ic:'📦',tit:`Acabando: ${p.nome}`,txt:`Restam ${p.estoque} (mínimo ${p.estoqueMin})`,acao:`closeModal();entradaRapida('${p.id}')`,acaoTxt:'Repor'}));
  }
  const ordem={critico:0,aviso:1,info:2};
  return n.sort((a,b)=>ordem[a.nivel]-ordem[b.nivel]);
}
function sysNotif(t,b){try{if(window.Notification&&Notification.permission==='granted'&&document.hidden)new Notification(t,{body:b||''});}catch(e){}}
function checarNotificacoes(){
  if(MODO!=='caixa'||!currentUser) return;
  const n=calcNotificacoes(); ultNotifs=n;
  n.forEach(x=>{
    if(notifVistos.has(x.id)) return; notifVistos.add(x.id);
    if(!notifInit||x.id[0]==='p') return;
    if(x.id[0]==='a'||x.id[0]==='r'||x.id[0]==='z'){beep(x.nivel==='critico'?3:2);toast((x.ic||'🔔')+' '+x.tit,x.nivel==='info'?'good':'bad');sysNotif(x.tit,x.txt);}
  });
  notifInit=true;
  const b=$('#notifBtn');
  if(b){const nv=n.some(x=>x.nivel==='critico')?'critico':n.some(x=>x.nivel==='aviso')?'aviso':'';b.className='notif-btn '+nv;b.innerHTML=`🔔 <b>${n.length}</b>`;b.title=n.length+' notificação(ões)';}
  if($('#notifLista')) renderNotifLista();
  if(current==='mesas'&&!$('#modal').innerHTML) renderMesas();
}
function abrirNotificacoes(){
  openModal('Notificações','<div id="notifLista"></div>',null,`<button class="cancel" onclick="closeModal();go('config')">Ajustar notificações</button><button class="cancel" style="color:var(--accent)" onclick="closeModal()">Fechar</button>`);

    ${x.acao?`<button class="btn ${x.nivel==='critico'?'pri':'gho'}" onclick="${x.acao}">${x.acaoTxt}</button>`:''}</div>`).join('')
    ||'<div style="color:var(--faint);padding:14px 4px;text-align:center">Tudo em dia ✓ Nenhuma notificação.</div>';
}
function pedirPermissaoNotif(){
  if(!window.Notification){toast('Este navegador não suporta notificações','bad');return;}
  Notification.requestPermission().then(p=>toast(p==='granted'?'Notificações do Windows ativadas':'Permissão negada no navegador',p==='granted'?'good':'bad'));

const _iniciarCaixaExtras2=iniciarCaixaExtras;
iniciarCaixaExtras=function(){
  _iniciarCaixaExtras2();

const CATS_DESP=['Fornecedores / insumos','Bebidas (compra)','Aluguel','Salários / diárias','Energia / água / gás','Impostos','Taxas de cartão / apps','Manutenção','Marketing','Outros'];

function finRange(p){
  const d=new Date(), y=d.getFullYear(), m=d.getMonth();
  const r=(a,b)=>[isoData(a),isoData(b)];
  switch(p){
    case 'hoje': return r(d,d);
    case 'ontem': {const o=new Date(y,m,d.getDate()-1);return r(o,o);}
    case '7d': return r(new Date(y,m,d.getDate()-6),d);
    case '30d': return r(new Date(y,m,d.getDate()-29),d);
    case 'mes': return r(new Date(y,m,1),d);
    case 'mesant': return r(new Date(y,m-1,1),new Date(y,m,0));
    case 'ano': return r(new Date(y,0,1),d);
  }
  return [finDe||isoHoje(),finAte||isoHoje()];
}
function vendaTs(v){
  if(v.ts) return v.ts;
  const d=parseVendaDate(v.dataHora); if(!d) return 0;
  const m=(v.dataHora||'').match(/\s(\d{2}):(\d{2})/); if(m)d.setHours(+m[1],+m[2]);
  return d.getTime();
}
function calcFinanceiro(de,ate){
  const t0=new Date(de+'T00:00:00').getTime(), t1=new Date(ate+'T23:59:59').getTime();
  const vs=db.vendas.filter(v=>{if(v.cancelada)return false;const t=vendaTs(v);return t>=t0&&t<=t1;});
  const lanc=(db.lancamentos||[]).filter(l=>l.data>=de&&l.data<=ate);
  let fat=0,desc=0,cmv=0,taxas=0,semCusto=0;
  const porMet={},porCanal={},porAt={},prods={},porCat={};
  vs.forEach(v=>{
    fat+=v.valor; taxas+=v.taxa||0;
    const itens=v.itens||[];
    const bruto=itens.reduce((s,i)=>s+i.preco*i.qtd,0);
    const fator=bruto>0?Math.min(1,(v.valor-(v.taxa||0))/bruto):1;
    itens.forEach(i=>{
      const p=db.produtos.find(x=>x.id===i.id); const custo=p?(+p.custo||0):0;
      if(!custo) semCusto+=i.preco*i.qtd*fator;
      cmv+=custo*i.qtd;
      const k=i.nome; if(!prods[k])prods[k]={q:0,t:0}; prods[k].q+=i.qtd; prods[k].t+=i.preco*i.qtd*fator;
      const at=i.garcom||v.vendedor||'Não informado'; porAt[at]=(porAt[at]||0)+i.preco*i.qtd*fator;
    });
    if(!itens.length){const at=v.vendedor||'Não informado';porAt[at]=(porAt[at]||0)+v.valor;}
    if(itens.length) desc+=Math.max(0,bruto+(v.taxa||0)-v.valor);
    const mt=v.metodo||'outros'; porMet[mt]=(porMet[mt]||0)+v.valor;
    const c=v.canal||'balcao'; porCanal[c]=(porCanal[c]||0)+v.valor;
  });
  let despesas=0,outras=0;
  lanc.forEach(l=>{if(l.tipo==='saida'){despesas+=l.valor;porCat[l.categoria||'Outros']=(porCat[l.categoria||'Outros']||0)+l.valor;}else outras+=l.valor;});
  const nd=Math.round((new Date(ate+'T12:00:00')-new Date(de+'T12:00:00'))/864e5)+1;
  const mensal=nd>62, serie={};
  const chave=t=>{const iso=isoData(new Date(t));return mensal?iso.slice(0,7):iso;};
  if(mensal){const a=new Date(de+'T12:00:00');a.setDate(1);const b=new Date(ate+'T12:00:00');while(a<=b){serie[isoData(a).slice(0,7)]={e:0,s:0};a.setMonth(a.getMonth()+1);}}
  else{const a=new Date(de+'T12:00:00');for(let i=0;i<nd;i++){serie[isoData(a)]={e:0,s:0};a.setDate(a.getDate()+1);}}
  vs.forEach(v=>{const k=chave(vendaTs(v));if(serie[k])serie[k].e+=v.valor;});
  lanc.forEach(l=>{const k=mensal?l.data.slice(0,7):l.data;if(serie[k]){if(l.tipo==='saida')serie[k].s+=l.valor;else serie[k].e+=l.valor;}});
  const receita=fat+outras, lucroBruto=receita-cmv, liquido=lucroBruto-despesas;
  return {de,ate,n:vs.length,fat,desc,cmv,taxas,semCusto,despesas,outras,receita,lucroBruto,liquido,ticket:vs.length?fat/vs.length:0,
    fiado:porMet.fiado||0,porMet,porCanal,porAt,prods,porCat,lanc,serie,mensal};
}

function chartFinHTML(f){
  const ks=Object.keys(f.serie); if(!ks.length) return '<div style="color:var(--faint)">Sem dados</div>';
  const W=1100,H=250,L=58,R=8,T=10,B=28, pw=W-L-R, ph=H-T-B;
  const mx=Math.max(1,...ks.map(k=>Math.max(f.serie[k].e,f.serie[k].s)));
  const pot=Math.pow(10,Math.floor(Math.log10(mx))); const passo=[1,2,2.5,5,10].map(x=>x*pot).find(x=>mx/x<=4)||pot*10; const top=Math.ceil(mx/passo)*passo;
  const y=v=>T+ph-(v/top)*ph, slot=pw/ks.length, bw=Math.max(2,Math.min(22,(slot-6)/2-1));
  const barra=(x,v,cor)=>{if(v<=0)return'';const yy=y(v),h=T+ph-yy,r=Math.min(4,bw/2,h);
    return `<path d="M${x},${T+ph}V${yy+r}Q${x},${yy} ${x+r},${yy}H${x+bw-r}Q${x+bw},${yy} ${x+bw},${yy+r}V${T+ph}Z" fill="${cor}"/>`;};
  let g='';
  for(let v=0;v<=top+1e-9;v+=passo){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--faint)">${v>=1000?(v/1000).toLocaleString('pt-BR')+' mil':v.toLocaleString('pt-BR')}</text>`;}
  const cadaX=Math.ceil(ks.length/12);
  let bars='',lbl='',hit='';
  ks.forEach((k,i)=>{
    const cx=L+slot*i+slot/2, d=f.serie[k];
    bars+=barra(cx-bw-1,d.e,'#4a90e2')+barra(cx+1,d.s,'#d9773a');
    const rot=f.mensal?(MESES[+k.slice(5,7)-1].slice(0,3)+'/'+k.slice(2,4)):k.slice(8,10)+'/'+k.slice(5,7);
    if(i%cadaX===0) lbl+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--faint)">${rot}</text>`;
    hit+=`<rect x="${L+slot*i}" y="${T}" width="${slot}" height="${ph}" fill="transparent" data-r="${rot}" data-e="${d.e}" data-s="${d.s}" class="fin-hit"/>`;
  });
  return `<div class="chart-leg"><span><i style="background:#4a90e2"></i>Entradas (vendas + receitas)</span><span><i style="background:#d9773a"></i>Saídas (despesas)</span></div>
    <div class="chart-box" id="finChart"><svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}<line x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}" stroke="var(--line2)"/>${bars}${lbl}${hit}</svg><div class="chart-tip" id="finTip"></div></div>
    <details style="margin-top:8px"><summary style="cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:700">Ver em tabela</summary>
      <table class="tbl" style="margin-top:6px"><thead><tr><th>${f.mensal?'Mês':'Dia'}</th><th class="right-num">Entradas</th><th class="right-num">Saídas</th><th class="right-num">Saldo</th></tr></thead><tbody>
      ${ks.map(k=>{const d=f.serie[k];return `<tr><td class="mono">${f.mensal?k.slice(5,7)+'/'+k.slice(0,4):brData(k)}</td><td class="right-num mono">${money(d.e)}</td><td class="right-num mono">${money(d.s)}</td><td class="right-num mono ${d.e-d.s<0?'neg':''}">${money(d.e-d.s)}</td></tr>`;}).join('')}</tbody></table></details>`;
}
function ligarTooltipFin(){
  const box=$('#finChart'), tip=$('#finTip'); if(!box||!tip) return;
  box.querySelectorAll('.fin-hit').forEach(r=>{
    r.addEventListener('mousemove',ev=>{
      const e=+r.dataset.e, s=+r.dataset.s, bb=box.getBoundingClientRect();
      tip.innerHTML=`<b>${r.dataset.r}</b><br><span style="color:#4a90e2">■</span> Entradas <b class="mono">${money(e)}</b><br><span style="color:#d9773a">■</span> Saídas <b class="mono">${money(s)}</b><br>Saldo <b class="mono">${money(e-s)}</b>`;
      tip.style.display='block';
      let x=ev.clientX-bb.left+14; if(x+190>bb.width) x=ev.clientX-bb.left-200;
      tip.style.left=x+'px'; tip.style.top=Math.max(0,ev.clientY-bb.top-30)+'px';
      r.setAttribute('fill','rgba(255,255,255,.04)');
    });
    r.addEventListener('mouseleave',()=>{tip.style.display='none';r.setAttribute('fill','transparent');});
  });
}

/* =====================================================================
   RZand+ 3 — Proteção dos dados na nuvem (salvamento visível, arquivo
   automático de vendas antigas, medidor de espaço, backup completo)
   e Aparência (logo redondo + temas de cor)
   ===================================================================== */
const LIMITE_DOC=1048576;          // limite do Firestore por documento (1 MB)
const DIAS_NO_CAIXA=60;            // vendas mais antigas que isso vão para o arquivo
let saveSeq=0, nuvemEstado='ok', tamanhoDoc=0, arquivando=false;
const _migrate3=migrate;
migrate=function(d){
  d=_migrate3(d); if(!d) return d;
  const c=d.config;
  if(c.tema===undefined) c.tema='escuro';
  if(c.logo===undefined) c.logo='';
  if(c.logoNoCupom===undefined) c.logoNoCupom=true;
  if(c.ultimoBackup===undefined) c.ultimoBackup=0;
  if(!c.arquivo) c.arquivo={qtd:0,desde:'',ate:''};
  return d;
};

/* ---------- 1) SALVAMENTO VISÍVEL ---------- */
function aparar(){
  if(db.estoqueMov&&db.estoqueMov.length>1000) db.estoqueMov.length=1000;
  if(db.fechamentos&&db.fechamentos.length>400) db.fechamentos.length=400;
}
store.save=function(){
  if(!currentUser||MODO!=='caixa') return;
  saveSeq++; setNuvem('salvando');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(salvarAgora,800);
};
function salvarAgora(){
  if(!currentUser||MODO!=='caixa') return;
  aparar();
  const json=JSON.stringify(db); tamanhoDoc=json.length;
  const seq=saveSeq;
  if(json.length>LIMITE_DOC-20000){
    setNuvem('erro'); toast('⚠ Espaço da nuvem cheio — arquivando vendas antigas…','bad');
    arquivarVendasAntigas(true).then(()=>{if(JSON.stringify(db).length<LIMITE_DOC-20000) salvarAgora();});
    return;
  }
  fsdb.collection('empresas').doc(currentUser.uid).set({dados:json},{merge:true})
    .then(()=>{if(seq===saveSeq)setNuvem('ok');})
    .catch(e=>{console.error('Erro ao salvar:',e);setNuvem('erro');toast('⚠ Não foi possível salvar na nuvem. Tentando de novo…','bad');setTimeout(()=>{if(seq===saveSeq)salvarAgora();},8000);});
  try{publicarCardapio()}catch(e){}
  if(tamanhoDoc>LIMITE_DOC*0.6) setTimeout(()=>arquivarVendasAntigas(),3000);
}
function setNuvem(st){
  nuvemEstado=st;
  const el=$('#nuvem'); if(!el) return;
  const off=!navigator.onLine;
  if(st==='ok'){el.className='nuvem ok';el.textContent='☁ Salvo';el.title='Todos os dados estão salvos na nuvem';}
  else if(st==='erro'){el.className='nuvem err';el.textContent='⚠ Não salvo';el.title='Não foi possível salvar. Verifique a internet.';}
  else{el.className='nuvem';el.textContent=off?'⏳ Sem internet':'⏳ Salvando…';el.title=off?'Sem internet: vai salvar quando a conexão voltar. Não feche o sistema.':'Salvando na nuvem';}
}
window.addEventListener('online',()=>{if(nuvemEstado!=='ok')salvarAgora();});
window.addEventListener('offline',()=>setNuvem('salvando'));
window.addEventListener('beforeunload',e=>{if(MODO==='caixa'&&currentUser&&nuvemEstado!=='ok'){e.preventDefault();e.returnValue='Há dados ainda não salvos na nuvem.';return e.returnValue;}});

/* ---------- 2) ARQUIVO AUTOMÁTICO DE VENDAS ANTIGAS ---------- */
function colArquivo(){return fsdb.collection('empresas').doc(currentUser.uid).collection('arquivo');}
function chaveVenda(v){return String(v.codigo||'x')+'_'+String(v.numero||0);}
async function arquivarVendasAntigas(forcar){
  if(arquivando||MODO!=='caixa'||!currentUser) return 0;
  const limite=Math.min(Date.now()-(forcar?20:DIAS_NO_CAIXA)*864e5,db.config.caixaAbertoEm||Date.now());
  const velhas=db.vendas.filter(v=>vendaTs(v)<limite);
  if(!velhas.length) return 0;
  arquivando=true;
  const porDia={};
  velhas.forEach(v=>{const t=vendaTs(v);const dia=t?isoData(new Date(t)):'0000-00-00';(porDia[dia]=porDia[dia]||{})[chaveVenda(v)]=JSON.stringify(v);});
  const dias=Object.keys(porDia).sort();
  try{
    for(const dia of dias) await colArquivo().doc(dia).set({dia,vendas:porDia[dia],atualizadoEm:Date.now()},{merge:true});
    const sai=new Set(velhas.map(chaveVenda));
    db.vendas=db.vendas.filter(v=>!sai.has(chaveVenda(v)));
    const A=db.config.arquivo;
    A.qtd=(A.qtd||0)+velhas.length;
    if(!A.desde||dias[0]<A.desde) A.desde=dias[0];
    if(!A.ate||dias[dias.length-1]>A.ate) A.ate=dias[dias.length-1];
    store.save();
    console.log('Arquivadas',velhas.length,'vendas em',dias.length,'dia(s)');
    if(current==='vendas') renderVendas();
    return velhas.length;
  }catch(e){
    console.error('Arquivo:',e);
    if(forcar) toast('⚠ Não consegui arquivar. Atualize as regras do Firebase (arquivo).','bad');
    return 0;
  }finally{arquivando=false;}
}
const arqVendas={}; const arqCarregado=new Set();
async function carregarArquivo(de,ate){
  const A=db.config.arquivo||{};
  if(!A.ate||!currentUser||de>A.ate) return 0;
  const k=de+'|'+ate; if(arqCarregado.has(k)) return 0;
  try{
    const s=await colArquivo().where('dia','>=',de).where('dia','<=',ate).get();
    let n=0; s.forEach(d=>{const vs=d.data().vendas||{};Object.keys(vs).forEach(c=>{if(!arqVendas[c]){try{arqVendas[c]=JSON.parse(vs[c]);n++;}catch(e){}}});});
    arqCarregado.add(k); return n;
  }catch(e){console.error('Ler arquivo:',e);return 0;}
}
function comArquivo(fn){
  const orig=db.vendas; const locais=new Set(orig.map(chaveVenda));
  db.vendas=orig.concat(Object.keys(arqVendas).filter(c=>!locais.has(c)).map(c=>arqVendas[c]));
  try{return fn();}finally{db.vendas=orig;}
}
const _calcFin3=calcFinanceiro;
calcFinanceiro=function(de,ate){return comArquivo(()=>_calcFin3(de,ate));};
const _renderFin3=renderFinanceiro;
renderFinanceiro=function(){
  _renderFin3();

  if(A.ate&&finDe<=A.ate&&!arqCarregado.has(finDe+'|'+finAte)){
    const h=view.querySelector('.scr-title'); if(h) h.insertAdjacentHTML('beforeend',' <span style="font-size:12px;color:var(--muted);font-weight:600">· buscando vendas antigas…</span>');
    carregarArquivo(finDe,finAte).then(()=>{if(current==='financeiro')_renderFin3();});
  }
};
const _gerarRelVendas3=gerarRelatorioVendas;
gerarRelatorioVendas=function(de,ate,cliSel){
  const A=db.config.arquivo||{};
  const d1=de||A.desde||'2000-01-01', d2=ate||isoHoje();
  if(A.ate&&d1<=A.ate){toast('Buscando vendas antigas no arquivo…');carregarArquivo(d1,d2).then(()=>comArquivo(()=>_gerarRelVendas3(de,ate,cliSel)));}
  else _gerarRelVendas3(de,ate,cliSel);
};
const _renderVendas3=renderVendas;
renderVendas=function(){
  _renderVendas3();

/* ---------- 3) BACKUP COMPLETO + LEMBRETE ---------- */
exportJSON=async function(){
  toast('Preparando backup completo…');
  let arquivo=[];
  try{const s=await colArquivo().get();s.forEach(d=>arquivo.push(d.data()));}catch(e){}
  const pacote={...db,__arquivo:arquivo,__backupEm:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(pacote)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='backup-'+(db.config.nomeLoja||'pdv').replace(/[^\w]+/g,'-').toLowerCase()+'-'+hoje().replace(/\//g,'-')+'.json';a.click();
  db.config.ultimoBackup=Date.now(); store.save();
  toast('Backup salvo no computador ('+(db.vendas.length+arquivo.reduce((s,d)=>s+Object.keys(d.vendas||{}).length,0))+' vendas)','good');
};
importJSON=function(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result); if(!d.produtos||!d.clientes) throw 0;
      const arq=d.__arquivo||[]; delete d.__arquivo; delete d.__backupEm;
      for(const doc of arq){if(doc&&doc.dia) await colArquivo().doc(doc.dia).set(doc,{merge:true});}
      db=migrate(d); store.save(); toast('Backup restaurado'+(arq.length?' (com arquivo)':''),'good'); go('home');
    }catch(e){toast('Arquivo de backup inválido','bad');}
  };
  r.readAsText(f);
};

  return n;
};

const TEMAS=[['escuro','Escuro',['#0f1318','#171d24','#ff7a3d']],['claro','Claro',['#f3f5f8','#ffffff','#ea6a26']],
  ['creme','Creme',['#f5eee1','#fffaf1','#d9661f']],['cafe','Bege escuro',['#241c15','#30261d','#f08a3e']]];
function aplicarAparencia(tema,logo){
  tema=tema||(db.config&&db.config.tema)||'escuro';
  logo=logo!==undefined?logo:(db.config&&db.config.logo);
  if(tema==='escuro') delete document.body.dataset.tema; else document.body.dataset.tema=tema;
  const mt=document.querySelector('meta[name=theme-color]'); if(mt) mt.content={escuro:'#0f1318',claro:'#ffffff',creme:'#fffaf1',cafe:'#1b140f'}[tema]||'#0f1318';

function escolherLogo(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  if(!/^image\//.test(f.type)){toast('Escolha uma imagem (JPG ou PNG)','bad');return;}
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const S=256,cv=document.createElement('canvas');cv.width=S;cv.height=S;
      const cx=cv.getContext('2d'); const lado=Math.min(img.width,img.height);
      cx.drawImage(img,(img.width-lado)/2,(img.height-lado)/2,lado,lado,0,0,S,S);
      let url=cv.toDataURL('image/webp',0.86);
      if(!url.startsWith('data:image/webp')) url=cv.toDataURL('image/png');
      if(url.length>160000) url=cv.toDataURL('image/jpeg',0.82);
      db.config.logo=url; store.save(); aplicarAparencia(); if(current==='config')renderConfig(); toast('Logo salvo','good');
    };
    img.onerror=()=>toast('Não consegui abrir essa imagem','bad');
    img.src=r.result;
  };
  r.readAsDataURL(f);
}

function mesaObj(id){return (db.mesas||[]).find(x=>x.id===id);}
function listaMesa(id){if(mesaAtual===id)return cart;const m=mesaObj(id);if(!m)return null;if(!m.comanda)m.comanda=[];return m.comanda;}
function fecharMesaSeVazia(m,lista){m.aberta=lista.length>0;if(m.aberta&&!m.abertaEm)m.abertaEm=Date.now();if(!m.aberta){m.abertaEm=null;m.pessoas=0;m.contaPedida=false;}}
function salvarMesa(id){
  const m=mesaObj(id); if(!m) return;
  if(mesaAtual===id){syncMesa();fecharMesaSeVazia(m,cart);if(current==='balcao')renderBalcao();}
  else fecharMesaSeVazia(m,m.comanda||[]);
}
function avisarCancelamentoCozinha(m,it,q,quem){
  if(!cozinhaOn()||!ehCozinha(it.id)||q<=0) return;
  colPedidos().add({tipo:'pedido',mesaId:m.id,mesaNome:'❌ CANCELAR · '+m.nome,itens:[{id:it.id,nome:it.nome,qtd:q,obs:'CANCELADO',preco:0}],
    origem:quem==='caixa'?'caixa':'garcom',garcom:quem||'',status:'lancado',impresso:false,entregue:true,ts:Date.now()}).catch(()=>{});
}
function aplicarAcao(a){
  let m=mesaObj(a.mesaId); if(!m) return;
  if(a.iid&&!(listaMesa(m.id)||[]).some(i=>i.iid===a.iid)){const outra=(db.mesas||[]).find(x=>(listaMesa(x.id)||[]).some(i=>i.iid===a.iid));if(outra)m=outra;}
  const lista=listaMesa(m.id); const quem=a.garcom||'';
  const ix=a.iid?lista.findIndex(i=>i.iid===a.iid):-1, it=ix>=0?lista[ix]:null;
  let msg='';
  if(a.acao==='qtd'||a.acao==='remover'){
    if(!it) return;
    const novo=a.acao==='remover'?0:Math.max(0,r2(+a.qtd||0));
    const envAntes=it.env||0, envDepois=Math.min(envAntes,novo);
    avisarCancelamentoCozinha(m,it,r2(envAntes-envDepois),quem);
    if(novo<=0){lista.splice(ix,1);msg=`${m.nome}: ${it.nome} excluído`;} else {it.qtd=novo;it.env=envDepois;msg=`${m.nome}: ${it.nome} → ${novo}`;}
    salvarMesa(m.id);
  }else if(a.acao==='obs'){
    if(!it) return; it.obs=String(a.obs||'').slice(0,140); salvarMesa(m.id); msg=`${m.nome}: observação em ${it.nome}`;
  }else if(a.acao==='pessoas'){
    m.pessoas=Math.max(0,Math.min(99,a.delta!==undefined?(m.pessoas||0)+(+a.delta||0):(parseInt(a.pessoas)||0))); msg=`${m.nome}: ${m.pessoas} pessoa(s)`;
  }else if(a.acao==='mover'){
    const d=mesaObj(a.destinoId); if(!d||d.id===m.id) return;
    const dest=listaMesa(d.id);
    const todos=!a.iids||!a.iids.length;
    const mov=todos?lista.slice():lista.filter(i=>a.iids.includes(i.iid));
    if(!mov.length) return;
    const ids=new Set(mov.map(i=>i.iid));
    for(let i=lista.length-1;i>=0;i--) if(ids.has(lista[i].iid)) lista.splice(i,1);
    dest.push(...mov.map(i=>({...i})));
    if(todos||!lista.length){d.pessoas=(d.pessoas||0)+(m.pessoas||0);d.contaPedida=d.contaPedida||m.contaPedida;}
    salvarMesa(m.id); salvarMesa(d.id);
    msg=todos?`${m.nome} → ${d.nome} (mesa trocada)`:`${mov.length} item(s) de ${m.nome} → ${d.nome}`;
  }else return;
  store.save();
  if(current==='mesas'&&!$('#modal').innerHTML) renderMesas();
  if(current==='home') renderHome();
  if(msg&&quem&&a.origem!=='caixa') toast('✏️ '+quem+' · '+msg,'good');
  return msg;
}
/* fila: pedidos e ações do garçom são aplicados um por vez, na ordem em que foram feitos */
const naFila=new Set(); let filaOp=[], processandoOp=false;
function enfileirarOp(doc){
  if(naFila.has(doc.id)) return; naFila.add(doc.id);
  filaOp.push({ref:doc.ref,ts:doc.data().ts||0,tipo:doc.data().tipo||'pedido'});
}
async function processarFilaOp(){
  if(processandoOp) return; processandoOp=true;
  while(filaOp.length){
    filaOp.sort((a,b)=>a.ts-b.ts);
    const it=filaOp.shift();
    try{

  }

}

migrate=function(d){
  d=_migrate5(d); if(!d) return d;

  if(c.protegerFin===undefined) c.protegerFin=true;

};
function syncSetores(d){
  d=d||db; if(!d.setores) d.setores=[];
  const tem=new Set(d.setores.map(x=>x.nome));
  (d.produtos||[]).forEach(p=>{if(p.categoria&&!tem.has(p.categoria)){d.setores.push({id:uid(),nome:p.categoria});tem.add(p.categoria);}});
}

let desbloqueadoAte=0;
async function hashSenha(s){
  const txt='rzand:'+(currentUser?currentUser.uid:'')+':'+s;
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  let h=0;for(const ch of txt)h=(h*31+ch.charCodeAt(0))|0;return 'f'+h;
}
function precisaSenha(v){
  if(!db.config.senhaHash||STAFF) return false;
  if(Date.now()<desbloqueadoAte) return false;
  return v==='config'||(v==='financeiro'&&db.config.protegerFin)||(v==='fechamento'&&db.config.protegerFech);
}

  (d.produtos||[]).forEach(p=>{if(p.custoEmb===undefined)p.custoEmb=0;if(p.custoFrete===undefined)p.custoFrete=0;});
  return d;
};
function finCfg(){return db.config.fin||{impostoPct:0,taxaPrevistaPct:0};}
function taxaPrevista(){const f=finCfg();if(+f.taxaPrevistaPct)return +f.taxaPrevistaPct;const m=maquininhas()[0];return m?(+m.credito||0):0;}
function pct(v,base){return base?(v/base*100):0;}
function fmtPct(x){return (Math.round(x*10)/10).toLocaleString('pt-BR')+'%';}
/* conta do lucro de uma unidade */
function contaProduto(venda,compra,emb,frete){
  const f=finCfg(); const imp=venda*(+f.impostoPct||0)/100, tx=venda*taxaPrevista()/100;
  const bruto=venda-compra, real=venda-compra-emb-frete-imp-tx;
  return {venda,compra,emb,frete,imp,tx,bruto,real,margemBruta:pct(bruto,venda),margemReal:pct(real,venda),markup:compra?pct(venda-compra,compra):0};
}
function boxLucroHTML(c){

  if(!(c.venda>0)) return '<span style="color:var(--faint);font-size:13px">Preencha o preço de venda e o de compra para ver o lucro.</span>';

    +`<div style="border-top:1px dashed var(--line2);margin:4px 0"></div>`+L('= Lucro bruto por unidade',money(c.bruto)+' · '+fmtPct(c.margemBruta),c.bruto<0?'neg':'')
    +(c.emb?L('(−) Embalagem',money(c.emb)):'')+(c.frete?L('(−) Transporte / frete',money(c.frete)):'')
    +(c.imp?L(`(−) Impostos (${fmtPct(+finCfg().impostoPct)})`,money(c.imp)):'')+(c.tx?L(`(−) Taxa de cartão (~${fmtPct(taxaPrevista())})`,money(c.tx)):'')
    +`<div style="border-top:1px dashed var(--line2);margin:4px 0"></div>`
    +`<div style="display:flex;justify-content:space-between;font-size:15px;font-weight:800;padding-top:2px"><span>= Sobra real por unidade</span><span class="mono" style="color:${c.real<0?'var(--danger)':'var(--money)'}">${money(c.real)} · ${fmtPct(c.margemReal)}</span></div>`
    +(c.compra?`<div style="font-size:11.5px;color:var(--faint);margin-top:4px">Markup sobre o custo: ${fmtPct(c.markup)} · as despesas fixas da loja (aluguel, salários…) entram no Financeiro</div>`:'');
}

    const sel=$('#entProd'); if(sel) sel.addEventListener('change',()=>{const p=db.produtos.find(x=>x.id===sel.value);$('#entCusto').value=p&&p.custo?p.custo:'';});
    const ok=modalConfirm;

      const nMov=db.estoqueMov.length; const r=ok(); if(r===false) return false;

      store.save(); return r;

}

/* ---------- Financeiro: DRE completo ---------- */
const _calcFin6=calcFinanceiro;
calcFinanceiro=function(de,ate){
  const f=_calcFin6(de,ate);
  const t0=new Date(de+'T00:00:00').getTime(), t1=new Date(ate+'T23:59:59').getTime();
  const vs=comArquivo(()=>db.vendas.filter(v=>{if(v.cancelada)return false;const t=vendaTs(v);return t>=t0&&t<=t1;}));
  let cmv=0,emb=0,semCusto=0,imp=0;
  vs.forEach(v=>{
    const itens=v.itens||[]; const bruto=itens.reduce((s,i)=>s+i.preco*i.qtd,0);
    const fator=bruto>0?Math.min(1,(v.valor-(v.taxa||0))/bruto):1;
    itens.forEach(i=>{const p=db.produtos.find(x=>x.id===i.id)||{};
      const c=i.custo!==undefined?i.custo:(+p.custo||0), e=(i.emb!==undefined?i.emb:(+p.custoEmb||0))+(i.frete!==undefined?i.frete:(+p.custoFrete||0));
      cmv+=c*i.qtd; emb+=e*i.qtd; if(!c) semCusto+=i.preco*i.qtd*fator;});
    const ip=v.impostoPct!==undefined?v.impostoPct:(+finCfg().impostoPct||0); imp+=v.valor*ip/100;
  });
  f.cmv=r2(cmv); f.embFrete=r2(emb); f.impostos=r2(imp); f.semCusto=r2(semCusto);
  f.receitaLiquida=r2(f.receita-f.impostos-f.taxasCartao);
  f.lucroBruto=r2(f.receitaLiquida-f.cmv-f.embFrete);
  f.liquido=r2(f.lucroBruto-f.despesas);
  f.compras=r2((db.estoqueMov||[]).filter(m=>m.tipo==='entrada'&&m.ts&&m.ts>=t0&&m.ts<=t1).reduce((s,m)=>s+(m.valor||0),0));
  const lucroProd={}; vs.forEach(v=>(v.itens||[]).forEach(i=>{const p=db.produtos.find(x=>x.id===i.id)||{};const c=i.custo!==undefined?i.custo:(+p.custo||0);
    if(!lucroProd[i.nome])lucroProd[i.nome]={q:0,venda:0,custo:0,temCusto:!!c};lucroProd[i.nome].q+=i.qtd;lucroProd[i.nome].venda+=i.preco*i.qtd;lucroProd[i.nome].custo+=c*i.qtd;}));
  f.lucroProd=lucroProd;
  return f;
};

    ${linha('(−) Despesas da loja (aluguel, salários, contas…)',f.despesas)}
    ${linha('= Lucro líquido',f.liquido,{forte:1,cor:f.liquido<0?'var(--danger)':'var(--money)'})}
    ${f.semCusto>0?`<div style="font-size:12px;color:#ffb547;margin-top:8px">⚠ ${money(f.semCusto)} vendidos em produtos sem preço de compra — cadastre o preço de compra para o lucro ficar exato.</div>`:''}
    <div style="font-size:12px;color:var(--faint);margin-top:6px">Compras de mercadoria no período (investimento em estoque): <b class="mono">${money(f.compras)}</b> — não entra como despesa, porque o custo já é descontado quando o produto é vendido. Por isso, não lance compras de produtos com preço de compra cadastrado também como despesa.</div>

  const kp=[...view.querySelectorAll('.kpi')];

  const grids=view.querySelectorAll('.fin-grid'); const g2=grids[1];
  if(g2){
    const arr=Object.entries(f.lucroProd).map(([n,x])=>({n,...x,lucro:x.venda-x.custo})).sort((a,b)=>b.lucro-a.lucro).slice(0,12);
    g2.insertAdjacentHTML('afterbegin',`<div class="fin-box"><h4>Lucro bruto por produto</h4>${arr.map(x=>`<div class="fin-row"><span>${esc(x.n)} <span style="color:var(--faint);font-size:12px">· ${r2(x.q)} un</span></span>

  }
};
