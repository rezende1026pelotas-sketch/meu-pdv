<style>
:root{
  --bg:#0f1318; --surface:#171d24; --surface2:#1e252e; --surface3:#252e39;
  --line:#2c3744; --line2:#37424f;
  --text:#eef2f6; --muted:#8b97a6; --faint:#5c6673;
  --accent:#ff7a3d;     /* laranja = ação principal (pagamento) */
  --money:#3ddc84;      /* verde = dinheiro / entra */
  --danger:#ff5a5a;     /* vermelho = sai / dívida */
  --blue:#3a97f0; --green:#57b85f; --teal:#2f9d8b; --sky:#5aa9e6;
  --r:14px; --r2:10px;
  --shadow:0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;
  font-size:15px;line-height:1.35;
}
.mono{font-family:'Spline Sans Mono','SF Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
.app{height:100vh;display:flex;flex-direction:column}

/* ---------- Top bar ---------- */
.topbar{
  height:52px;flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:0 16px;background:#0b0e12;border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em}
.brand .dot{width:34px;height:26px;border-radius:8px;font-size:13px;letter-spacing:-0.5px;
  background:linear-gradient(135deg,var(--accent),#ff9d5c);
  display:grid;place-items:center;font-size:15px;color:#1a1005;font-weight:800}
.topbar .clock{color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;line-height:1.15;border-left:1px solid var(--line);padding-left:14px}
.topbar .clock b{color:var(--text);font-weight:600}
.topbar .center{flex:1;text-align:center;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:12px}
.topbar .pill{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;
  background:var(--surface2);padding:6px 11px;border-radius:20px;border:1px solid var(--line)}
.pill .live{width:8px;height:8px;border-radius:50%;background:var(--money);box-shadow:0 0 0 3px rgba(61,220,132,.18)}

/* ---------- Warning banner ---------- */
.banner{background:linear-gradient(90deg,#c96a12,#e08420);color:#fff;font-weight:600;font-size:13px;
  padding:9px 16px;display:flex;align-items:center;gap:8px}
.banner a{color:#fff;text-decoration:underline;cursor:pointer}
.banner .x{margin-left:auto;opacity:.8}

/* ---------- Views ---------- */
.view{flex:1;min-height:0;overflow:auto;padding:16px}
.view::-webkit-scrollbar{width:10px;height:10px}
.view::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}


/* ---------- Auth screens ---------- */
.auth-screen{display:flex;align-items:center;justify-content:center;height:100vh;padding:20px}
.auth-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:440px;padding:40px 32px;box-shadow:var(--shadow)}
.auth-box .logo{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.auth-box .logo .dot{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),#ff9d5c);display:grid;place-items:center;font-size:22px;color:#1a1005;font-weight:800}
.auth-box .logo span{font-size:26px;font-weight:800;letter-spacing:-.02em}
.auth-box .sub{color:var(--muted);font-size:14px;margin-bottom:28px}
.auth-box .finput{margin-bottom:14px}
.auth-box .auth-btn{width:100%;padding:16px;background:var(--accent);color:#1a1005;font-weight:800;font-size:16px;border-radius:var(--r2);margin-top:4px}
.auth-box .auth-btn:hover{filter:brightness(1.06)}
.auth-box .auth-btn:disabled{opacity:.5;cursor:not-allowed}
.auth-box .switch{text-align:center;margin-top:18px;color:var(--muted);font-size:14px}
.auth-box .switch a{color:var(--accent);font-weight:700;cursor:pointer}
.auth-box .err{color:var(--danger);font-size:13px;margin:8px 0;min-height:18px}
.topbar .user-info{margin-left:auto;display:flex;align-items:center;gap:10px}
.topbar .user-info .empresa{font-size:13px;font-weight:600;color:var(--text)}
.topbar .user-info .email{font-size:11px;color:var(--faint)}
.topbar .logout{color:var(--muted);font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);font-weight:600}
.topbar .logout:hover{background:var(--surface2);color:var(--danger)}
.loading-screen{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--muted);font-size:16px;flex-direction:column;gap:14px}
.spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Home tiles ---------- */
.home{display:grid;grid-template-columns:1.25fr 2fr;gap:14px;height:100%}
.home-right{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:14px;min-height:0}
.tile{border-radius:var(--r);padding:22px;display:flex;flex-direction:column;justify-content:center;
  position:relative;overflow:hidden;color:#fff;transition:transform .08s,filter .15s;border:1px solid rgba(255,255,255,.06)}
.tile:active{transform:scale(.985)}
.tile:hover{filter:brightness(1.07)}
.tile .k{position:absolute;top:14px;right:16px;font-size:12px;font-weight:800;background:rgba(0,0,0,.22);padding:3px 10px;border-radius:7px;letter-spacing:.02em}
.tile .t{font-size:20px;font-weight:800;letter-spacing:.01em;line-height:1.1}
.tile .s{font-size:13px;opacity:.92;margin-top:6px;font-weight:500;line-height:1.25}
.tile.balcao{background:linear-gradient(160deg,#2f7fd6,#3a97f0);align-items:flex-start;justify-content:flex-end}
.tile.balcao .t{font-size:38px;letter-spacing:.02em}
.tile.balcao .s{font-size:16px}
.tile.cliente{background:linear-gradient(160deg,#4fa257,#63bd6c)}
.tile.vendedor{background:linear-gradient(160deg,#3d8a44,#4fa257)}
.tile.credito{background:linear-gradient(160deg,#4a94cf,#5aa9e6)}
.tile.cadastro{background:linear-gradient(160deg,#2b8c7d,#37a596)}
.tile.vendas{background:linear-gradient(160deg,#3a4653,#48566a)}
.tile.sangria{background:linear-gradient(160deg,#3a4653,#48566a)}
.tile.config{background:linear-gradient(160deg,#33404d,#3f5061)}
.tile.entregas{background:linear-gradient(160deg,#d9772e,#ef8f3c)}
.tile.fechamento{background:linear-gradient(160deg,#2f8f4e,#3aa85e)}
.tile.mesas{background:linear-gradient(160deg,#6d5bd0,#8272e0)}
.mesa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mesa-card{min-height:120px;display:flex;flex-direction:column;border-radius:var(--r);padding:14px;cursor:pointer;border:2px solid var(--line);background:var(--surface)}
.mesa-card.livre{border-color:#3aa85e55}
.mesa-card.ocup{border-color:#ef8f3c;background:#ef8f3c11}
.canal-seg{display:flex;gap:6px;margin-bottom:12px}
.canal-seg button{flex:1;padding:11px 8px;border-radius:var(--r2);border:1px solid var(--line);background:var(--surface2);color:var(--muted);font-weight:700;font-size:14px;cursor:pointer}
.canal-seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.moto-chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px}
.moto-chip .mx{cursor:pointer;color:var(--muted);font-weight:800}
.ent-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.ent-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800}

/* ---------- Screen header ---------- */
.scr-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.back{display:flex;flex-direction:column;line-height:1.05;color:var(--accent);font-weight:700;font-size:15px;
  padding:8px 14px;border-radius:var(--r2);background:var(--surface);border:1px solid var(--line)}
.back small{color:var(--faint);font-weight:500;font-size:10.5px}
.scr-title{font-size:19px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.scr-head .spacer{flex:1}

/* ---------- Balcão / PDV ---------- */
.pdv{display:grid;grid-template-columns:1fr 340px;gap:14px;height:100%}
.pdv-left{display:flex;flex-direction:column;min-height:0;gap:12px}
.searchbar{display:flex;gap:10px}
.searchbar input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);
  color:var(--text);padding:12px 14px;font-size:15px;outline:none}
.searchbar input:focus{border-color:var(--accent)}
.cart{flex:0 0 auto;max-height:35vh;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
.cart.empty-cart{max-height:60px;flex:0 0 auto}
.cart table{width:100%;border-collapse:collapse}
.cart th{position:sticky;top:0;background:var(--surface2);color:var(--muted);font-size:11px;text-transform:uppercase;
  letter-spacing:.05em;text-align:left;padding:11px 14px;font-weight:700;border-bottom:1px solid var(--line)}
.cart td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.cart tr:hover td{background:rgba(255,255,255,.02)}
.cart .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--faint);gap:10px;padding:40px}
.cart .empty svg{opacity:.4}
.qtybox{display:inline-flex;align-items:center;gap:8px}
.qtybox button{width:26px;height:26px;border-radius:7px;background:var(--surface3);font-size:16px;font-weight:700;color:var(--text);display:grid;place-items:center}
.qtybox button:hover{background:var(--line2)}
.trash{color:var(--danger);font-size:17px;padding:4px 6px}
.right-num{text-align:right}

.prodgrid{flex:1;min-height:180px;overflow:auto;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;padding-right:4px}
.prod{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r2);padding:12px 10px;
  text-align:center;display:flex;flex-direction:column;gap:5px;min-height:70px;justify-content:center;transition:.1s;
  position:relative;cursor:pointer;user-select:none}

async function doLogin(){
  const email=document.getElementById('authEmail').value.trim();

  authError('');

async function doRegister(){
  const empresa=document.getElementById('regEmpresa').value.trim();

  const pass=document.getElementById('regPass').value;
  const pass2=document.getElementById('regPass2').value;

  if(!email){authError('Informe o e-mail.');return;}
  if(pass.length<6){authError('Senha precisa ter no mínimo 6 caracteres.');return;}
  if(pass!==pass2){authError('As senhas não coincidem.');return;}
  authError('');
  try{
    const cred=await auth.createUserWithEmailAndPassword(email,pass);
    // Salva info da empresa no Firestore
    await fsdb.collection('empresas').doc(cred.user.uid).set({
      empresa: empresa, email: email, criadoEm: new Date().toISOString(),
      dados: JSON.stringify(seedComNome(empresa))

// Migração: garante campos de estoque em bases salvas antes desta versão
function migrate(d){
  if(!d) return d;
  if(!d.estoqueMov) d.estoqueMov=[];
  if(!d.fechamentos) d.fechamentos=[];
  if(!d.mesas) d.mesas=[];
  (d.vendas||[]).forEach(v=>{ if(v.ts===undefined) v.ts=0; });
  (d.caixa||[]).forEach(m=>{ if(m.ts===undefined) m.ts=0; });
  if(d.config && d.config.expressCheckout===undefined) d.config.expressCheckout=false;
  if(d.config && d.config.sigla===undefined) d.config.sigla='RZ';
  if(d.config && !d.config.modulos) d.config.modulos={entregas:true, mesas:false};
  if(!d.motoboys) d.motoboys=[];
  (d.motoboys||[]).forEach(m=>{ if(m.idade===undefined)m.idade=''; if(m.moto===undefined)m.moto=''; if(m.placa===undefined)m.placa=''; if(m.ativo===undefined)m.ativo=true; });
  (d.vendas||[]).forEach(v=>{ if(v.canal===undefined) v.canal='balcao'; });
  (d.produtos||[]).forEach(p=>{
    if(p.estoque===undefined) p.estoque=25;
    if(p.estoqueMin===undefined) p.estoqueMin=5;
    if(p.controla===undefined) p.controla=true;
    if(p.marca===undefined) p.marca='';
    if(p.peso===undefined) p.peso='';
    if(p.unidade===undefined) p.unidade='un';
    if(p.codigoBarras===undefined) p.codigoBarras='';
  });
  return d;
}

            ${[4,5,6].map(n=>`<button class="key" onclick="recebNum(${n},'${metodo}',${total})">${n}</button>`).join('')}<button class="key q" onclick="recebAdd(20,'${metodo}',${total})">+20</button>
            ${[7,8,9].map(n=>`<button class="key" onclick="recebNum(${n},'${metodo}',${total})">${n}</button>`).join('')}<button class="key q" onclick="recebAdd(50,'${metodo}',${total})">+50</button>
            <button class="key op" onclick="recebBack('${metodo}',${total})">⌫</button><button class="key" onclick="recebNum(0,'${metodo}',${total})">0</button>
            <button class="key op c" onclick="recebVal=0;renderRecebimento('${metodo}',${total})">C</button><button class="key q" onclick="recebAdd(100,'${metodo}',${total})">+100</button>

          <button style="width:100%;padding:14px;margin-top:8px;color:var(--accent);font-weight:700;font-size:14px;text-align:center" onclick="recebVal=${total};renderRecebimento('${metodo}',${total})">RECEBER VALOR TOTAL (${money(total)})</button>
        </div>
        <div style="flex:1;min-width:220px">
          <div style="color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;font-weight:700">Resumo</div>
          <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px"><span>Produtos (${cart.length})</span><span class="mono">${money(cart.reduce((s,i)=>s+i.preco*i.qtd,0))}</span></div>
          ${descontoPct>0?`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px"><span>Desconto</span><span class="mono neg">-${descontoPct}%</span></div>`:''}
          <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:16px"><span>Total</span><span class="mono">${money(total)}</span></div>
          <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px"><span>Recebido</span><span class="mono">${money(recebVal)}</span></div>
          <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px"><span>A receber</span><span class="mono ${falta>0?'neg':''}">${money(falta)}</span></div>
          <div style="display:flex;justify-content:space-between;padding:14px 0;font-weight:800;font-size:20px"><span>Troco</span><span class="mono pos">${money(troco)}</span></div>

}
function recebNum(n,met,tot){recebVal=Math.round((recebVal*10+n*.01)*100)/100;renderRecebimento(met,tot)}
function recebBack(met,tot){recebVal=Math.floor(recebVal*10)/100;renderRecebimento(met,tot)}
function recebAdd(v,met,tot){recebVal=Math.round((recebVal+v)*100)/100;renderRecebimento(met,tot)}

function finalizarVenda(metodo,total,recebido){
  const cli=cliente(db.clienteAtualId);
  if(metodo==='fiado' && (!cli || cli.nome.startsWith('Consumidor'))){
    toast('Selecione um cliente para vender fiado','bad');closeModal();openClientePicker('atual');return;
  }
  const mesaObj = mesaAtual ? db.mesas.find(x=>x.id===mesaAtual) : null;
  const ent=(canalAtual==='entrega');
  const venda={
    codigo:String(1784590000000+Math.floor(Math.random()*9e5)),
    ts:Date.now(),
    dataHora:agora(), cliente:cli?cli.nome:'Consumidor Final', clienteId:cli?cli.id:null,
    numero:db.contador++, valor:total, fiscal:'Pendente',
    metodo, itens:cart.map(i=>({id:i.id,nome:i.nome,qtd:i.qtd,preco:i.preco,obs:i.obs||''})),
    canal: mesaObj?'mesa':canalAtual,
    mesa: mesaObj?mesaObj.nome:null,
    motoboyId: ent?(entregaMotoboyId||null):null,
    taxa: ent?(entregaTaxa||0):0,
    endereco: ent?(entregaEndereco||''):'',
    entregaStatus: ent?'rota':null
  };
  db.vendas.unshift(venda);
  // Baixa de estoque + registro de movimentação
  let alertas=[];
  cart.forEach(i=>{
    const p=db.produtos.find(x=>x.id===i.id);
    if(p&&p.controla){
      p.estoque-=i.qtd;
      db.estoqueMov.unshift({data:agora(),produto:p.nome,tipo:'venda',qtd:-i.qtd,saldo:p.estoque});
      if(p.estoque<=0) alertas.push(p.nome+' zerou');
      else if(p.estoque<=p.estoqueMin) alertas.push(p.nome+' baixo ('+p.estoque+')');
    }
  });
  if(metodo==='fiado'){
    cli.saldo-=total;
    cli.historico.unshift({data:hoje(),valor:-total,op:'Venda',vendaNum:venda.numero});
  }
  if(mesaObj){ mesaObj.comanda=[]; mesaObj.aberta=false; mesaObj.abertaEm=null; }
  store.save();
  cart=[];descontoPct=0;recebVal=0;
  canalAtual='balcao';entregaMotoboyId=null;entregaTaxa=0;entregaEndereco='';
  const eraMesa=!!mesaObj;
  mesaAtual=null;
  closeModal();
  if(eraMesa){
    toast('Mesa fechada · '+money(venda.valor)+' ('+metodoLabel(metodo)+')','good');
    go('mesas');
  }else if(db.config.expressCheckout){
    toast('Venda #'+venda.numero+' · '+money(venda.valor)+' ('+metodoLabel(metodo)+')','good');
    go('balcao');
  }else{
    mostrarSucesso(venda,metodo);
  }
  if(alertas.length) setTimeout(()=>toast('Estoque: '+alertas.join(' · '),'bad'),700);
}

function metCor(m){return {dinheiro:'var(--money)',pix:'var(--teal)',credito:'var(--blue)',debito:'var(--sky)',fiado:'var(--accent)'}[m]||'var(--muted)';}
function setEntFiltroMoto(id){entFiltroMoto=id;renderEntregas();}
function setEntFiltroStatus(s){entFiltroStatus=s;renderEntregas();}

  const cardHTML=listaOrd.map((v,idx)=>{

      <span class="mx" title="Editar" onclick="editMotoboy('${m.id}')">✎</span>

  store.save();renderEntregas();toast('Entrega concluída','good');
}

function addMotoboy(){
  openModal('Adicionar motoboy',`
    <label class="fl" style="margin-top:0">Nome do motoboy</label>
    <input class="finput" id="motoNome" placeholder="Nome / apelido">
    <label class="fl">Idade</label>
    <input class="finput mono" id="motoIdade" type="number" placeholder="Ex.: 28">
    <label class="fl">Moto (modelo)</label>
    <input class="finput" id="motoMoto" placeholder="Ex.: Honda CG 160">
    <label class="fl">Placa</label>
    <input class="finput" id="motoPlaca" placeholder="Ex.: ABC1D23">
  `,()=>{
    const nome=$('#motoNome').value.trim();if(!nome){toast('Informe o nome','bad');return false;}
    db.motoboys.push({id:uid(),nome,idade:$('#motoIdade').value.trim(),moto:$('#motoMoto').value.trim(),placa:$('#motoPlaca').value.trim().toUpperCase(),ativo:true});
    store.save();if(current==='entregas')renderEntregas();toast('Motoboy adicionado','good');
  });
}
function editMotoboy(id){
  const m=db.motoboys.find(x=>x.id===id);if(!m)return;
  openModal('Editar motoboy',`
    <label class="fl" style="margin-top:0">Nome do motoboy</label>
    <input class="finput" id="motoNome" value="${esc(m.nome)}">
    <label class="fl">Idade</label>
    <input class="finput mono" id="motoIdade" type="number" value="${esc(m.idade||'')}" placeholder="Ex.: 28">
    <label class="fl">Moto (modelo)</label>
    <input class="finput" id="motoMoto" value="${esc(m.moto||'')}" placeholder="Ex.: Honda CG 160">
    <label class="fl">Placa</label>
    <input class="finput" id="motoPlaca" value="${esc(m.placa||'')}" placeholder="Ex.: ABC1D23">
  `,()=>{
    const nome=$('#motoNome').value.trim();if(!nome){toast('Informe o nome','bad');return false;}
    m.nome=nome;m.idade=$('#motoIdade').value.trim();m.moto=$('#motoMoto').value.trim();m.placa=$('#motoPlaca').value.trim().toUpperCase();
    store.save();if(current==='entregas')renderEntregas();toast('Motoboy salvo','good');
  });
}
function verMotoboy(id){
  const m=db.motoboys.find(x=>x.id===id);if(!m)return;
  const emRota=db.vendas.filter(v=>v.canal==='entrega'&&v.motoboyId===id&&v.entregaStatus!=='entregue').length;
  openModal('Motoboy · '+esc(m.nome),`
    <div style="display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px">
      <span style="color:var(--muted)">Nome</span><b>${esc(m.nome)}</b>
      <span style="color:var(--muted)">Idade</span><span>${m.idade?esc(m.idade)+' anos':'—'}</span>
      <span style="color:var(--muted)">Moto</span><span>${m.moto?esc(m.moto):'—'}</span>
      <span style="color:var(--muted)">Placa</span><span class="mono">${m.placa?esc(m.placa):'—'}</span>
      <span style="color:var(--muted)">Em rota agora</span><b>${emRota} entrega(s)</b>
    </div>
  `,null,`<button class="btn" onclick="editMotoboy('${id}')">Editar</button><button class="cancel" onclick="closeModal()" style="color:var(--accent)">Fechar</button>`);
}
function delMotoboy(id){
  confirmModal('Remover motoboy?','As entregas já registradas com ele continuam no histórico.',()=>{
    db.motoboys=db.motoboys.filter(x=>x.id!==id);
    if(entregaMotoboyId===id)entregaMotoboyId=null;
    if(entFiltroMoto===id)entFiltroMoto='todos';
    store.save();if(current==='entregas')renderEntregas();toast('Motoboy removido');
  });
}

/* ============ CLIENTES ============ */
let cliFilter='';
function renderClientes(){
  const cli=db.clientes.filter(c=>c.nome.toLowerCase().includes(cliFilter.toLowerCase()));
  view.innerHTML=`
  <div class="scr-head">
    <button class="back" onclick="go('home')">Voltar<small>SHIFT + ESC</small></button>
    <div class="scr-title">Clientes</div><div class="spacer"></div>
    <button class="btn pri" onclick="editCliente()">Novo cliente</button>
  </div>
  <input class="list-search" placeholder="Buscar cliente…" value="${esc(cliFilter)}" oninput="cliFilter=this.value;renderClientes()">
  <div class="card">
    ${cli.map(c=>`<div class="clirow">
      <div class="av" style="font-weight:800;font-size:14px">${esc(c.nome.charAt(0))}</div>
      <div class="nm" onclick="selecionarCliente('${c.id}')">${esc(c.nome)}</div>
      <div class="sal mono ${c.saldo<0?'neg':c.saldo>0?'pos':'zero'}">${c.saldo?money(c.saldo):''}</div>
      <button class="rowbtn edit" onclick="editCliente('${c.id}')">✎</button>
      ${c.nome.startsWith('Consumidor')?'':`<button class="rowbtn del" onclick="delCliente('${c.id}')">✕</button>`}
    </div>`).join('')}
  </div>`;
}
function selecionarCliente(id){db.clienteAtualId=id;store.save();toast('Cliente selecionado: '+cliente(id).nome,'good');go('balcao')}
function editCliente(id,voltaPicker){
  const c=id?cliente(id):null;
  openModal(c?'Editar cliente':'Adicionar cliente',`
    <label class="fl">Nome do cliente</label>
    <input class="finput" id="cliNome" value="${c?esc(c.nome):''}" placeholder="Nome / apelido">
    <label class="fl">Saldo inicial (negativo = fiado a pagar)</label>
    <input class="finput mono" id="cliSaldo" value="${c?c.saldo:0}" type="number" step="0.01">
  `,()=>{
    const nome=$('#cliNome').value.trim();if(!nome){toast('Informe o nome','bad');return false;}
    const saldo=parseFloat($('#cliSaldo').value)||0;
    if(c){c.nome=nome;c.saldo=saldo;}else{db.clientes.push({id:uid(),nome,saldo,historico:[]});}
    store.save();if(current==='clientes')renderClientes();toast('Cliente salvo','good');
    if(voltaPicker)setTimeout(()=>openClientePicker(),100);
  });
}
function delCliente(id,voltaPicker){
  confirmModal('Excluir cliente?','Esta ação não pode ser desfeita.',()=>{
    db.clientes=db.clientes.filter(c=>c.id!==id);
    if(db.clienteAtualId===id)db.clienteAtualId=db.clientes[0].id;
    store.save();if(current==='clientes')renderClientes();toast('Cliente excluído');
    if(voltaPicker)setTimeout(()=>openClientePicker(),100);
  });
}
function openClientePicker(modo){
  openModal('Clientes',`
    <div style="display:flex;gap:10px;margin-bottom:14px">
      <input class="finput" id="pickSearch" placeholder="Buscar cliente…" style="flex:1;margin:0" oninput="renderPickList(this.value)">
      <button class="btn pri" onclick="closeModal();editCliente(null,true)">Adicionar cliente</button>
    </div>
    <div id="pickList" style="max-height:50vh;overflow:auto;margin:0 -4px">${pickListHTML('')}</div>
  `, null, `<button class="cancel" onclick="closeModal()">Cancelar</button>`);
}
function pickListHTML(q){
  return db.clientes.filter(c=>c.nome.toLowerCase().includes(q.toLowerCase())).map(c=>{
    const isPadrao=c.nome.startsWith('Consumidor');
    return `<div class="clirow">
      <div class="av" style="font-weight:800;font-size:14px" onclick="db.clienteAtualId='${c.id}';store.save();closeModal();toast('Cliente: ${esc(c.nome).replace(/'/g,'')}','good');render()">${esc(c.nome.charAt(0))}</div>
      <div class="nm" style="flex:1;cursor:pointer" onclick="db.clienteAtualId='${c.id}';store.save();closeModal();toast('Cliente: ${esc(c.nome).replace(/'/g,'')}','good');render()">${esc(c.nome)}</div>
      <div class="sal mono ${c.saldo<0?'neg':''}">${c.saldo?money(c.saldo):''}</div>
      ${isPadrao?'':`<button class="rowbtn edit" title="Editar" onclick="event.stopPropagation();closeModal();editCliente('${c.id}',true)">✎</button>
      <button class="rowbtn del" title="Excluir" onclick="event.stopPropagation();closeModal();delCliente('${c.id}',true)">✕</button>`}
    </div>`}).join('');
}
function renderPickList(q){$('#pickList').innerHTML=pickListHTML(q)}
function trocarVendedor(){
  openModal('Vendedor',`<label class="fl">Nome do vendedor</label><input class="finput" id="vendNome" value="${esc(db.vendedor)}">`,
   ()=>{const v=$('#vendNome').value.trim();if(v){db.vendedor=v;store.save();render();toast('Vendedor atualizado','good')}});

/* ============ CRÉDITO / FIADO ============ */

    <button class="back" onclick="go('home')">Voltar<small>SHIFT + ESC</small></button>

    <div class="spacer"></div>
    <button class="btn gho" onclick="relatorioDevedores()">Devedores (negativos)</button>
    <button class="btn pri" onclick="abrirRelatorioCredito()">Imprimir / PDF do cliente</button>
  </div>
  <div class="credito">
    <div class="credito-left">
      <select class="sel" onchange="db.creditoClienteId=this.value;credAmount=0;renderCredito()">
        ${db.clientes.filter(x=>!x.nome.startsWith('Consumidor')).map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.nome)}</option>`).join('')}
      </select>
      <div class="saldo-box">Saldo atual

      </div>
      <div class="tabs">
        <div class="tab add ${credTab==='add'?'on':''}" onclick="credTab='add';credAmount=0;renderCredito()">Adicionar (F3)</div>
        <div class="tab rem ${credTab==='rem'?'on':''}" onclick="credTab='rem';credAmount=0;renderCredito()">Remover (F4)</div>
      </div>
      <div class="field-lbl">Valor</div>
      <div class="big-amount">${money(credAmount)}</div>
      <div class="keypad">
        ${[1,2,3].map(n=>`<button class="key" onclick="keyNum(${n})">${n}</button>`).join('')}<button class="key q" onclick="keyAdd(10)">+10</button>
        ${[4,5,6].map(n=>`<button class="key" onclick="keyNum(${n})">${n}</button>`).join('')}<button class="key q" onclick="keyAdd(20)">+20</button>
        ${[7,8,9].map(n=>`<button class="key" onclick="keyNum(${n})">${n}</button>`).join('')}<button class="key q" onclick="keyAdd(50)">+50</button>
        <button class="key op" onclick="keyBack()">⌫</button><button class="key" onclick="keyNum(0)">0</button>
        <button class="key op c" onclick="credAmount=0;renderCredito()">C</button><button class="key q" onclick="keyAdd(100)">+100</button>
      </div>
      <button class="confirm-btn ${credTab==='rem'?'rem':''}" ${credAmount>0?'':'disabled'} onclick="confirmarCredito()">
        Confirmar ${credTab==='add'?'adição':'remoção'}</button>
    </div>
    <div class="card" style="overflow:auto">
      <table class="tbl"><thead><tr><th>Data</th><th class="right-num">Valor</th><th>Operação</th><th class="right-num">Ações</th></tr></thead><tbody>
      ${(c.historico||[]).map((h,hi)=>`<tr style="cursor:pointer" onclick="verDetalheLancamento('${c.id}',${hi})">
        <td class="mono">${h.data}</td>
        <td class="right-num mono ${h.valor<0?'neg':'pos'}">${money(h.valor)}</td>
        <td>${h.op}${h.vendaNum?` <span style="color:var(--faint);font-size:11px">#${h.vendaNum}</span>`:''}</td>
        <td class="right-num" style="white-space:nowrap">
          <button class="rowbtn" title="Imprimir" onclick="event.stopPropagation();imprimirLancamento('${c.id}',${hi})">⎙</button>
          <button class="rowbtn edit" title="Editar" onclick="event.stopPropagation();editarLancamento('${c.id}',${hi})">✎</button>
          <button class="rowbtn del" title="Excluir" onclick="event.stopPropagation();excluirLancamento('${c.id}',${hi})">✕</button>

/* --- ver detalhes de um lançamento (busca a venda vinculada) --- */
function verDetalheLancamento(cid,hi){
  const c=cliente(cid),h=c.historico[hi];
  // tenta encontrar a venda vinculada
  let venda=null;
  if(h.vendaNum) venda=db.vendas.find(v=>v.numero===h.vendaNum);
  if(!venda && h.op==='Venda'){
    // busca por data/valor/cliente
    venda=db.vendas.find(v=>v.cliente===c.nome && Math.abs(v.valor+h.valor)<0.01);
  }
  let body=`
    <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)">
      <span style="color:var(--muted)">Data</span><span class="mono">${h.data}</span></div>
    <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)">
      <span style="color:var(--muted)">Operação</span><span>${h.op}</span></div>
    <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)">
      <span style="color:var(--muted)">Valor</span><span class="mono" style="font-size:18px;font-weight:800;${h.valor<0?'color:var(--danger)':'color:var(--money)'}">${money(h.valor)}</span></div>`;
  if(venda && venda.itens && venda.itens.length){
    body+=`<div style="margin-top:16px;font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Itens da compra</div>`;
    body+=venda.itens.map(i=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)">
      <span>${i.qtd}× ${esc(i.nome)}${i.obs?` <span style="color:var(--accent);font-size:11px">(${esc(i.obs)})</span>`:''}</span>
      <span class="mono">${money(i.preco*i.qtd)}</span></div>`).join('');
    body+=`<div style="display:flex;justify-content:space-between;padding:12px 0;font-weight:800;font-size:16px">
      <span>Total</span><span class="mono">${money(venda.valor)}</span></div>`;
    body+=`<div style="color:var(--faint);font-size:12px;margin-top:4px">Venda #${venda.numero} · ${venda.dataHora} · ${metodoLabel(venda.metodo)}</div>`;
  } else if(h.op==='Venda'){
    body+=`<div style="color:var(--faint);font-size:13px;margin-top:14px">Detalhes dos itens não disponíveis para este lançamento.</div>`;
  }
  openModal('Detalhes · '+c.nome, body, null);
}
/* --- editar / excluir / imprimir lançamento do crédito --- */
function editarLancamento(cid,hi){
  const c=cliente(cid),h=c.historico[hi];
  openModal('Editar lançamento',`
    <label class="fl">Data</label><input class="finput mono" id="lcData" value="${h.data}">
    <label class="fl">Valor (negativo = débito/venda)</label><input class="finput mono" id="lcVal" type="number" step="0.01" value="${h.valor}">
    <label class="fl">Operação</label>
    <select class="sel" id="lcOp">
      ${['Venda','Adição de Crédito','Remoção de Crédito','Ajuste'].map(o=>`<option ${h.op===o?'selected':''}>${o}</option>`).join('')}
      ${['Venda','Adição de Crédito','Remoção de Crédito','Ajuste'].includes(h.op)?'':`<option selected>${esc(h.op)}</option>`}
    </select>
  `,()=>{
    const novoVal=parseFloat($('#lcVal').value);if(isNaN(novoVal)){toast('Valor inválido','bad');return false;}
    c.saldo += (novoVal - h.valor); // ajusta saldo pela diferença
    h.data=$('#lcData').value.trim(); h.valor=novoVal; h.op=$('#lcOp').value;
    store.save();renderCredito();toast('Lançamento atualizado','good');
  });
}
function excluirLancamento(cid,hi){
  const c=cliente(cid),h=c.historico[hi];
  confirmModal('Excluir lançamento?','O saldo do cliente será recalculado sem este lançamento.',()=>{
    c.saldo -= h.valor; c.historico.splice(hi,1);
    store.save();renderCredito();toast('Lançamento excluído');
  });
}
function imprimirLancamento(cid,hi){
  const c=cliente(cid),h=c.historico[hi];
  doPrint(`<div class="receipt"><h2>${esc(db.config.nomeLoja)}</h2>
    <div class="rc-sub">COMPROVANTE DE CRÉDITO</div>
    <div class="rc-line">Cliente: ${esc(c.nome)}</div>
    <div class="rc-line">Data: ${h.data}</div><hr>
    <table class="rc-tbl"><tr><td>${h.op}</td><td style="text-align:right"><b>${money(h.valor)}</b></td></tr>
      <tr><td>Saldo atual</td><td style="text-align:right">${money(c.saldo)}</td></tr></table>
    <div class="rc-foot">Documento sem valor fiscal</div></div>`);
}
/* --- relatório / extrato do cliente em PDF, com período --- */
function abrirRelatorioCredito(){
  const c=cliente(db.creditoClienteId);
  openModal('Relatório do cliente · '+c.nome,`
    <div style="display:flex;gap:12px">
      <div style="flex:1"><label class="fl">De</label><input class="finput" id="crDe" type="date"></div>
      <div style="flex:1"><label class="fl">Até</label><input class="finput" id="crAte" type="date"></div>
    </div>
    <p style="color:var(--muted);font-size:13px;margin:2px 0 0">Deixe em branco para o extrato completo. Na janela de impressão escolha "Salvar como PDF" para enviar ao cliente.</p>
  `, ()=>{ gerarRelatorioCredito(c.id,$('#crDe').value,$('#crAte').value); },
  `<button class="cancel" onclick="closeModal()">Cancelar</button><button class="ok" onclick="doOk()">Gerar / Imprimir</button>`);
}
function parseBRDate(s){const m=(s||'').match(/(\d{2})\/(\d{2})\/(\d{2,4})/);if(!m)return null;const y=+m[3];return new Date(y<100?2000+y:y,+m[2]-1,+m[1]);}
function gerarRelatorioCredito(cid,de,ate){
  const c=cliente(cid);
  const dDe=de?new Date(de+'T00:00:00'):null,dAte=ate?new Date(ate+'T23:59:59'):null;
  const lista=(c.historico||[]).filter(h=>{const d=parseBRDate(h.data);if(dDe&&d&&d<dDe)return false;if(dAte&&d&&d>dAte)return false;return true;});
  const somaVendas=lista.filter(h=>h.valor<0).reduce((s,h)=>s+h.valor,0);
  const somaCred=lista.filter(h=>h.valor>0).reduce((s,h)=>s+h.valor,0);
  const linhas=lista.map(h=>`<tr><td>${h.data}</td><td>${esc(h.op)}</td><td style="text-align:right">${money(h.valor)}</td></tr>`).join('')||'<tr><td colspan="3" style="text-align:center">Sem lançamentos no período</td></tr>';
  const periodo=(de?de.split('-').reverse().join('/'):'início')+' até '+(ate?ate.split('-').reverse().join('/'):'hoje');
  doPrint(`<div class="report">
    <h2>${esc(db.config.nomeLoja)}</h2>
    <div class="rp-sub">EXTRATO DE CRÉDITO / FIADO</div>
    <div class="rp-meta">Cliente: <b>${esc(c.nome)}</b><br>Período: ${periodo}<br>Emitido em ${agora()}</div>
    <table class="rp-tbl"><thead><tr><th>Data</th><th>Operação</th><th style="text-align:right">Valor</th></tr></thead>
      <tbody>${linhas}</tbody></table>
    <div class="rp-total">Compras (débito): ${money(somaVendas)} &nbsp;·&nbsp; Créditos: ${money(somaCred)}<br>
      <b style="font-size:15px">Saldo atual: ${money(c.saldo)}</b></div>
  </div>`);
}
/* --- relatório de TODOS os clientes com saldo negativo (fiado a receber) --- */
function listaDevedores(){
  return db.clientes
    .filter(c=>c.saldo < -0.005 && !c.nome.startsWith('Consumidor'))
    .sort((a,b)=>a.saldo-b.saldo); // maior dívida primeiro
}
function relatorioDevedores(){
  const lista=listaDevedores();
  if(!lista.length){toast('Nenhum cliente com saldo negativo','good');return;}
  const total=lista.reduce((s,c)=>s+c.saldo,0);
  const linhas=lista.map((c,i)=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)">
    <span>${i+1}. ${esc(c.nome)}</span>
    <span class="mono" style="font-weight:700;color:var(--danger);white-space:nowrap">${money(Math.abs(c.saldo))}</span></div>`).join('');
  openModal('Clientes devedores · '+lista.length,`
    <div style="max-height:46vh;overflow:auto">${linhas}</div>
    <div style="display:flex;justify-content:space-between;padding:12px 2px 2px;border-top:2px solid var(--text);margin-top:6px;font-weight:800;font-size:16px">
      <span>Total a receber</span>
      <span class="mono" style="color:var(--danger)">${money(Math.abs(total))}</span></div>
  `, null,
  `<button class="cancel" onclick="closeModal()">Fechar</button><button class="ok" onclick="imprimirDevedores()">Imprimir / PDF</button>`);
}
function imprimirDevedores(){
  const lista=listaDevedores();
  const total=lista.reduce((s,c)=>s+c.saldo,0);
  const linhas=lista.map((c,i)=>`<tr><td>${i+1}</td><td>${esc(c.nome)}</td>
    <td style="text-align:right;font-weight:700">${money(Math.abs(c.saldo))}</td></tr>`).join('');
  doPrint(`<div class="report">
    <h2>${esc(db.config.nomeLoja)}</h2>
    <div class="rp-sub">CLIENTES DEVEDORES · FIADO A RECEBER</div>
    <div class="rp-meta">Clientes com saldo negativo: <b>${lista.length}</b><br>Emitido em ${agora()}</div>
    <table class="rp-tbl"><thead><tr><th>#</th><th>Cliente</th><th style="text-align:right">Valor devido</th></tr></thead>
      <tbody>${linhas}</tbody></table>
    <div class="rp-total"><b style="font-size:16px">Total a receber: ${money(Math.abs(total))}</b></div>
  </div>`);
}
function keyNum(n){credAmount=Math.round((credAmount*10 + n*.01)*100)/100;renderCredito()}
function keyBack(){credAmount=Math.floor(credAmount*10)/100;renderCredito()}
function keyAdd(v){credAmount=Math.round((credAmount+v)*100)/100;renderCredito()}
function confirmarCredito(){
  const c=cliente(db.creditoClienteId);

function abrirRelatorioVendas(clienteId,nomeFallback){

  const cliOpts=`<option value="">Todos os clientes</option>`
    +db.clientes.map(c=>`<option value="${c.id}" ${c.id===clienteId?'selected':''}>${esc(c.nome)}</option>`).join('')
    +((nomeFallback&&!naLista)?`<option value="__nome:${esc(nomeFallback)}" selected>${esc(nomeFallback)} (não cadastrado)</option>`:'');
  openModal('Relatório de vendas',`

  `, ()=>{ gerarRelatorioVendas($('#repDe').value,$('#repAte').value,$('#repCli').value); },
  `<button class="cancel" onclick="closeModal()">Cancelar</button><button class="ok" onclick="doOk()">Gerar / Imprimir</button>`);
}
function gerarRelatorioVendas(de,ate,cliSel){
  const dDe=de?new Date(de+'T00:00:00'):null,dAte=ate?new Date(ate+'T23:59:59'):null;
  let nomeFiltro='Todos os clientes',cliObj=null,nomeMatch=null;
  if(cliSel&&cliSel.startsWith('__nome:')){nomeMatch=cliSel.slice(7);nomeFiltro=nomeMatch;}
  else if(cliSel){cliObj=cliente(cliSel);nomeFiltro=cliObj?cliObj.nome:'';}
  const lista=db.vendas.filter(v=>{
    if(v.cancelada)return false;
    const d=parseVendaDate(v.dataHora);
    if(dDe&&d&&d<dDe)return false;
    if(dAte&&d&&d>dAte)return false;
    if(cliObj){if(!(v.clienteId===cliObj.id||v.cliente===cliObj.nome))return false;}
    else if(nomeMatch){if(v.cliente!==nomeMatch)return false;}
    return true;
  });
  const total=lista.reduce((s,v)=>s+v.valor,0);
  const linhas=lista.map(v=>`<tr><td>${v.dataHora}</td><td>#${v.numero}</td><td>${esc(v.cliente)}</td><td>${metodoLabel(v.metodo)}</td><td style="text-align:right">${money(v.valor)}</td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center">Sem vendas no período</td></tr>';
  const periodo=(de?de.split('-').reverse().join('/'):'início')+' até '+(ate?ate.split('-').reverse().join('/'):'hoje');
  doPrint(`<div class="report">
    <h2>${esc(db.config.nomeLoja)}</h2>
    <div class="rp-sub">RELATÓRIO DE VENDAS</div>
    <div class="rp-meta">Período: ${periodo}<br>Cliente: ${esc(nomeFiltro)}<br>Emitido em ${agora()}</div>
    <table class="rp-tbl"><thead><tr><th>Data/Hora</th><th>Venda</th><th>Cliente</th><th>Pagamento</th><th style="text-align:right">Valor</th></tr></thead>
      <tbody>${linhas}</tbody></table>
    <div class="rp-total"><b style="font-size:15px">Total: ${money(total)}</b> · ${lista.length} venda(s)</div>
  </div>`);
}

/* ---- Alterar pagamento ---- */
function reconciliarFiado(v, novoMetodo, novoValor){
  // desfaz efeito antigo e aplica o novo no saldo do cliente
  const cli=v.clienteId?cliente(v.clienteId):db.clientes.find(c=>c.nome===v.cliente);
  if(!cli) return;
  const antigo=(v.metodo==='fiado')?v.valor:0;
  const novo=(novoMetodo==='fiado')?novoValor:0;
  const delta=antigo-novo; // saldo += delta
  if(delta!==0){
    cli.saldo+=delta;
    cli.historico.unshift({data:hoje(),valor:delta,op:'Ajuste (edição venda #'+v.numero+')'});
  }
}
function alterarPagamento(ix){
  const v=db.vendas[ix];
  const mets=[['dinheiro','Dinheiro'],['pix','PIX'],['credito','Cartão de crédito'],['debito','Cartão de débito'],['fiado','Fiado']];
  openModal('Alterar pagamento · #'+v.numero,`
    <label class="fl">Forma de pagamento</label>
    <select class="sel" id="novoMet">${mets.map(m=>`<option value="${m[0]}" ${v.metodo===m[0]?'selected':''}>${m[1]}</option>`).join('')}</select>
  `,()=>{
    const nm=$('#novoMet').value;
    if(nm==='fiado' && !(v.clienteId?cliente(v.clienteId):db.clientes.find(c=>c.nome===v.cliente))){
      toast('Venda sem cliente cadastrado para fiado','bad');return false;}
    reconciliarFiado(v,nm,v.valor);v.metodo=nm;store.save();renderVendas();toast('Pagamento alterado','good');
  });
}

/* ---- Editar venda (itens, cliente, pagamento) ---- */
function editarVenda(ix){
  const v=db.vendas[ix];
  const temItens=(v.itens&&v.itens.length);
  const mets=[['dinheiro','Dinheiro'],['pix','PIX'],['credito','Cartão de crédito'],['debito','Cartão de débito'],['fiado','Fiado']];
  const cliOpts=db.clientes.map(c=>`<option value="${c.id}" ${((v.clienteId&&v.clienteId===c.id)||(!v.clienteId&&c.nome===v.cliente))?'selected':''}>${esc(c.nome)}</option>`).join('');
  let body=`
    <label class="fl">Cliente</label>
    <select class="sel" id="edCli">${cliOpts}</select>
    <label class="fl">Forma de pagamento</label>
    <select class="sel" id="edMet">${mets.map(m=>`<option value="${m[0]}" ${v.metodo===m[0]?'selected':''}>${m[1]}</option>`).join('')}</select>`;
  if(temItens){
    body+=`<label class="fl">Itens (quantidade — 0 remove)</label>
      <div id="edItens">${v.itens.map((i,k)=>`
        <div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)">
          <span style="flex:1">${esc(i.nome)}</span>
          <span class="mono" style="color:var(--muted);font-size:12px">${money(i.preco)}</span>
          <input class="finput mono edq" data-k="${k}" type="number" step="1" value="${i.qtd}" style="width:74px;margin:0;text-align:right">
        </div>`).join('')}</div>`;
  }else{
    body+=`<label class="fl">Valor total (R$)</label><input class="finput mono" id="edVal" type="number" step="0.01" value="${v.valor}">`;
  }
  openModal('Editar venda · #'+v.numero,body,()=>{
    const novoCli=cliente($('#edCli').value);
    const novoMet=$('#edMet').value;
    let novoTotal, novosItens=v.itens;
    if(temItens){
      novosItens=[];
      document.querySelectorAll('.edq').forEach(inp=>{
        const k=+inp.dataset.k, q=parseInt(inp.value)||0, it=v.itens[k];
        if(q>0) novosItens.push({...it,qtd:q});
      });
      if(!novosItens.length){toast('A venda precisa de ao menos 1 item','bad');return false;}
      novoTotal=novosItens.reduce((s,i)=>s+i.preco*i.qtd,0);
      // reconcilia estoque: repõe qtd antiga, baixa qtd nova
      v.itens.forEach(old=>{const p=db.produtos.find(x=>x.id===old.id);if(p&&p.controla)p.estoque+=old.qtd;});
      novosItens.forEach(ni=>{const p=db.produtos.find(x=>x.id===ni.id);if(p&&p.controla)p.estoque-=ni.qtd;});
    }else{
      novoTotal=parseFloat($('#edVal').value);
      if(isNaN(novoTotal)){toast('Valor inválido','bad');return false;}
    }
    if(novoMet==='fiado' && !novoCli){toast('Selecione um cliente para fiado','bad');return false;}
    // reconcilia fiado considerando cliente + método + valor novos
    // desfaz efeito antigo no cliente antigo
    reconciliarFiado(v,'dinheiro',0); // zera efeito antigo (novoMetodo!=fiado => remove débito antigo)
    v.metodo=novoMet; v.clienteId=novoCli?novoCli.id:null; v.cliente=novoCli?novoCli.nome:'Consumidor Final'; v.valor=novoTotal; v.itens=novosItens;
    // aplica efeito novo
    if(novoMet==='fiado' && novoCli){ novoCli.saldo-=novoTotal; novoCli.historico.unshift({data:hoje(),valor:-novoTotal,op:'Venda (editada #'+v.numero+')'}); }
    store.save();renderVendas();toast('Venda #'+v.numero+' atualizada','good');
  });
}

/* ============ FECHAMENTO DE CAIXA ============ */
function calcFechamento(desde){
  const ini=desde!==undefined?desde:db.config.caixaAbertoEm;
  const vs=db.vendas.filter(v=>(v.ts||0)>=ini);
  const movs=db.caixa.filter(m=>(m.ts||0)>=ini);
  const metodos=['dinheiro','pix','credito','debito','fiado'];
  const porMetodo={};
  metodos.forEach(m=>porMetodo[m]={n:0,total:0});
  vs.forEach(v=>{const m=porMetodo[v.metodo]; if(m){m.n++;m.total+=v.valor;}});
  const fiado=porMetodo.fiado.total;
  const totalBruto=vs.reduce((s,v)=>s+v.valor,0);
  const recebido=totalBruto-fiado;
  const taxas=vs.reduce((s,v)=>s+(v.taxa||0),0);
  const dinheiroBalcao=vs.filter(v=>v.metodo==='dinheiro'&&v.canal!=='entrega').reduce((s,v)=>s+v.valor,0);
  const reforcos=movs.filter(m=>m.tipo==='reforco').reduce((s,m)=>s+m.valor,0);
  const sangrias=movs.filter(m=>m.tipo==='sangria').reduce((s,m)=>s+m.valor,0);
  const dinheiroGaveta=dinheiroBalcao+reforcos-sangrias;
  const ent=vs.filter(v=>v.canal==='entrega');
  const grupos={};
  ent.forEach(v=>{const k=v.motoboyId||'sem';(grupos[k]=grupos[k]||[]).push(v);});
  const porMotoboy=Object.keys(grupos).map(k=>{
    const arr=grupos[k];
    return {
      id:k, nome:k==='sem'?'Sem motoboy':motoboyNome(k), n:arr.length,
      dinheiro:arr.filter(v=>v.metodo==='dinheiro').reduce((s,v)=>s+v.valor,0),
      online:arr.filter(v=>['pix','credito','debito'].includes(v.metodo)).reduce((s,v)=>s+v.valor,0),
      fiado:arr.filter(v=>v.metodo==='fiado').reduce((s,v)=>s+v.valor,0),
      taxa:arr.reduce((s,v)=>s+(v.taxa||0),0),
      total:arr.reduce((s,v)=>s+v.valor,0)
    };
  });
  return {ini,nVendas:vs.length,porMetodo,fiado,totalBruto,recebido,taxas,dinheiroBalcao,reforcos,sangrias,dinheiroGaveta,porMotoboy};
}

function renderFechamento(){
  const f=calcFechamento();
  const d=new Date(f.ini);const p=n=>String(n).padStart(2,'0');
  const aberto=`${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
  const metRows=['dinheiro','pix','credito','debito','fiado'].map(m=>{
    const x=f.porMetodo[m];
    return `<tr><td>${metodoLabel(m)}</td><td class="right-num">${x.n}</td><td class="right-num mono">${money(x.total)}</td></tr>`;
  }).join('');
  const motoRows=f.porMotoboy.map(g=>`<tr>
    <td>${esc(g.nome)}</td><td class="right-num">${g.n}</td>
    <td class="right-num mono" style="color:var(--money)">${money(g.dinheiro)}</td>
    <td class="right-num mono" style="color:var(--blue)">${money(g.online)}</td>
    <td class="right-num mono">${money(g.taxa)}</td>
    <td class="right-num mono" style="font-weight:700">${money(g.total)}</td></tr>`).join('')
    || '<tr><td colspan="6" style="text-align:center;color:var(--faint);padding:20px">Nenhuma entrega no período</td></tr>';
  const histRows=(db.fechamentos||[]).map((h,i)=>`<tr onclick="verFechamento(${i})" style="cursor:pointer">
    <td class="mono">${h.data}</td><td class="right-num">${h.nVendas}</td>
    <td class="right-num mono">${money(h.recebido)}</td>
    <td style="text-align:right;color:var(--accent)">ver ›</td></tr>`).join('')
    || '<tr><td colspan="4" style="text-align:center;color:var(--faint);padding:20px">Nenhum fechamento ainda</td></tr>';

  view.innerHTML=`
  <div class="scr-head">
    <button class="back" onclick="go('home')">Voltar<small>ESC</small></button>
    <div class="scr-title">Fechamento de caixa</div>
    <div class="spacer"></div>
    <button class="btn" onclick="imprimirFechamento()">Imprimir</button>
    <button class="btn dan" onclick="confirmarFecharCaixa()">Fechar caixa</button>
  </div>
  <div style="padding:16px;max-width:1000px;margin:0 auto">
    <div style="color:var(--muted);font-size:13px;margin-bottom:14px">Período em aberto desde <b>${aberto}</b></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px">
      <div class="ent-card" style="flex:1;min-width:150px"><div style="color:var(--muted);font-size:12px">Recebido</div><div class="mono" style="font-size:24px;font-weight:800;color:var(--money)">${money(f.recebido)}</div></div>
      <div class="ent-card" style="flex:1;min-width:150px"><div style="color:var(--muted);font-size:12px">A receber (fiado)</div><div class="mono" style="font-size:24px;font-weight:800;color:var(--accent)">${money(f.fiado)}</div></div>
      <div class="ent-card" style="flex:1;min-width:150px"><div style="color:var(--muted);font-size:12px">Vendas</div><div class="mono" style="font-size:24px;font-weight:800">${f.nVendas}</div></div>
      <div class="ent-card" style="flex:1;min-width:150px"><div style="color:var(--muted);font-size:12px">Taxas de entrega</div><div class="mono" style="font-size:24px;font-weight:800">${money(f.taxas)}</div></div>
    </div>

    <div style="font-weight:700;font-size:14px;margin-bottom:8px">Por forma de pagamento</div>
    <div class="card" style="margin-bottom:20px"><table class="tbl"><thead><tr><th>Forma</th><th class="right-num">Qtd</th><th class="right-num">Total</th></tr></thead><tbody>${metRows}</tbody></table></div>

    <div style="font-weight:700;font-size:14px;margin-bottom:8px">Dinheiro na gaveta (esperado)</div>
    <div class="card" style="margin-bottom:20px;padding:14px 16px">
      <div style="display:flex;justify-content:space-between;padding:5px 0"><span>Vendas em dinheiro (balcão)</span><span class="mono">${money(f.dinheiroBalcao)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:5px 0"><span>+ Reforços</span><span class="mono pos">${money(f.reforcos)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:5px 0"><span>− Sangrias</span><span class="mono neg">${money(f.sangrias)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:10px 0 0;border-top:1px solid var(--line);margin-top:5px;font-weight:800;font-size:16px"><span>Esperado na gaveta</span><span class="mono">${money(f.dinheiroGaveta)}</span></div>
      <div style="color:var(--faint);font-size:12px;margin-top:6px">O dinheiro das entregas está com os motoboys — veja a tabela abaixo.</div>
    </div>

    <div style="font-weight:700;font-size:14px;margin-bottom:8px">Entregas por motoboy</div>
    <div class="card" style="margin-bottom:20px"><table class="tbl"><thead><tr><th>Motoboy</th><th class="right-num">Ent.</th><th class="right-num">Dinheiro</th><th class="right-num">Cartão/Pix</th><th class="right-num">Taxa</th><th class="right-num">Total</th></tr></thead><tbody>${motoRows}</tbody></table></div>

    <div style="font-weight:700;font-size:14px;margin-bottom:8px">Fechamentos anteriores</div>
    <div class="card"><table class="tbl"><thead><tr><th>Data</th><th class="right-num">Vendas</th><th class="right-num">Recebido</th><th></th></tr></thead><tbody>${histRows}</tbody></table></div>
  </div>`;
}

function confirmarFecharCaixa(){
  const f=calcFechamento();
  if(f.nVendas===0){toast('Nenhuma venda no período para fechar','bad');return;}
  confirmModal('Fechar o caixa?',`Vai arquivar ${f.nVendas} venda(s) · recebido ${money(f.recebido)}. O período recomeça do zero (as vendas continuam no histórico).`,()=>{
    db.fechamentos.unshift({
      data:agora(), ini:f.ini, fim:Date.now(),
      nVendas:f.nVendas, recebido:f.recebido, totalBruto:f.totalBruto, fiado:f.fiado, taxas:f.taxas,
      porMetodo:f.porMetodo, dinheiroGaveta:f.dinheiroGaveta, reforcos:f.reforcos, sangrias:f.sangrias,
      dinheiroBalcao:f.dinheiroBalcao, porMotoboy:f.porMotoboy, loja:db.config.nomeLoja, vendedor:db.vendedor
    });
    db.config.caixaAbertoEm=Date.now();
    store.save();renderFechamento();toast('Caixa fechado. Novo período iniciado.','good');
  });
}

function imprimirFechamento(snap){
  const f=snap||calcFechamento();
  const metLinhas=['dinheiro','pix','credito','debito','fiado'].map(m=>`<tr><td>${metodoLabel(m)}</td><td style="text-align:right">${money((f.porMetodo[m]||{}).total||0)}</td></tr>`).join('');
  const motoLinhas=(f.porMotoboy||[]).map(g=>`<tr><td>${esc(g.nome)} (${g.n})</td><td style="text-align:right">${money(g.total)}</td></tr>`).join('')||'<tr><td colspan="2" style="color:#666">Sem entregas</td></tr>';
  doPrint(`<div class="receipt">
    <h2>${esc(db.config.nomeLoja)}</h2>
    <div class="rc-sub">Fechamento de caixa</div>
    <div class="rc-line">${snap?snap.data:agora()}</div>
    <div class="rc-line">Vendedor: ${esc(db.vendedor)}</div>
    <hr>
    <div class="rc-line"><b>Por forma de pagamento</b></div>
    <table class="rc-tbl">${metLinhas}</table>
    <hr>
    <table class="rc-tbl">
      <tr><td><b>RECEBIDO</b></td><td style="text-align:right"><b>${money(f.recebido)}</b></td></tr>
      <tr><td>A receber (fiado)</td><td style="text-align:right">${money(f.fiado)}</td></tr>
      <tr><td>Taxas de entrega</td><td style="text-align:right">${money(f.taxas)}</td></tr>
      <tr><td>Dinheiro na gaveta</td><td style="text-align:right">${money(f.dinheiroGaveta)}</td></tr>
    </table>
    <hr>
    <div class="rc-line"><b>Entregas por motoboy</b></div>
    <table class="rc-tbl">${motoLinhas}</table>
    <div class="rc-foot">Documento sem valor fiscal</div>
  </div>`);
}

function verFechamento(i){
  const h=db.fechamentos[i];if(!h)return;
  const metLinhas=['dinheiro','pix','credito','debito','fiado'].map(m=>`<div style="display:flex;justify-content:space-between;padding:3px 0"><span style="color:var(--muted)">${metodoLabel(m)}</span><span class="mono">${money((h.porMetodo[m]||{}).total||0)}</span></div>`).join('');
  const motoLinhas=(h.porMotoboy||[]).map(g=>`<div style="display:flex;justify-content:space-between;padding:3px 0"><span style="color:var(--muted)">${esc(g.nome)}</span><span class="mono">${money(g.total)}</span></div>`).join('')||'<div style="color:var(--faint);font-size:13px">Sem entregas</div>';
  openModal('Fechamento · '+h.data,`
    <div style="display:flex;justify-content:space-between;padding:4px 0;font-weight:800;font-size:16px"><span>Recebido</span><span class="mono" style="color:var(--money)">${money(h.recebido)}</span></div>
    <div style="display:flex;justify-content:space-between;padding:3px 0"><span style="color:var(--muted)">A receber (fiado)</span><span class="mono">${money(h.fiado)}</span></div>
    <div style="display:flex;justify-content:space-between;padding:3px 0"><span style="color:var(--muted)">Taxas</span><span class="mono">${money(h.taxas)}</span></div>
    <div style="display:flex;justify-content:space-between;padding:3px 0"><span style="color:var(--muted)">Dinheiro na gaveta</span><span class="mono">${money(h.dinheiroGaveta)}</span></div>
    <hr style="border:none;border-top:1px solid var(--line);margin:8px 0">
    <div style="font-weight:700;font-size:13px;margin-bottom:4px">Formas de pagamento</div>${metLinhas}
    <hr style="border:none;border-top:1px solid var(--line);margin:8px 0">
    <div style="font-weight:700;font-size:13px;margin-bottom:4px">Por motoboy</div>${motoLinhas}
  `,null,`<button class="btn" onclick="imprimirFechamento(db.fechamentos[${i}])">Imprimir</button><button class="cancel" onclick="closeModal()" style="color:var(--accent)">Fechar</button>`);
}

/* ============ MESAS / COMANDAS ============ */
function mesaNome(){const m=mesaAtual?db.mesas.find(x=>x.id===mesaAtual):null;return m?m.nome:'';}
function syncMesa(){
  if(!mesaAtual)return;
  const m=db.mesas.find(x=>x.id===mesaAtual);
  if(m){m.comanda=cart.map(i=>({...i}));m.aberta=cart.length>0;if(cart.length&&!m.abertaEm)m.abertaEm=Date.now();if(!cart.length)m.abertaEm=null;store.save();}
}
function abrirMesa(id){
  const m=db.mesas.find(x=>x.id===id);if(!m)return;
  mesaAtual=id;
  cart=(m.comanda||[]).map(i=>({...i}));
  descontoPct=0;canalAtual='balcao';recebVal=0;
  go('balcao');
}
function voltarMesas(){ syncMesa(); mesaAtual=null; cart=[]; go('mesas'); }
function imprimirComanda(){
  const m=mesaAtual?db.mesas.find(x=>x.id===mesaAtual):null;if(!m)return;
  const linhas=cart.map(i=>`<tr><td>${i.qtd}x ${esc(i.nome)}${i.obs?' ('+esc(i.obs)+')':''}</td><td style="text-align:right">${money(i.preco*i.qtd)}</td></tr>`).join('')||'<tr><td colspan="2" style="color:#666">Sem itens</td></tr>';
  const tot=cart.reduce((s,i)=>s+i.preco*i.qtd,0);
  doPrint(`<div class="receipt"><h2>${esc(db.config.nomeLoja)}</h2><div class="rc-sub">Comanda · ${esc(m.nome)}</div><div class="rc-line">${agora()}</div><hr><table class="rc-tbl">${linhas}</table><hr><table class="rc-tbl"><tr><td><b>TOTAL PARCIAL</b></td><td style="text-align:right"><b>${money(tot)}</b></td></tr></table><div class="rc-foot">Comanda — não é documento fiscal</div></div>`);
}
function renderMesas(){
  const mesas=db.mesas||[];
  const cards=mesas.map(m=>{
    const tot=(m.comanda||[]).reduce((s,i)=>s+i.preco*i.qtd,0);
    const ocupada=m.aberta && (m.comanda||[]).length>0;
    const min=m.abertaEm?Math.floor((Date.now()-m.abertaEm)/60000):0;
    return `<div class="mesa-card ${ocupada?'ocup':'livre'}" onclick="abrirMesa('${m.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="font-weight:800;font-size:17px">${esc(m.nome)}</div>
        <span class="mx" style="cursor:pointer;color:var(--muted);font-weight:800" title="Editar" onclick="event.stopPropagation();editMesa('${m.id}')">✎</span>
      </div>
      ${ocupada
        ? `<div style="margin-top:auto"><div class="mono" style="font-size:22px;font-weight:800;color:#ef8f3c">${money(tot)}</div>
           <div style="font-size:12px;color:var(--muted)">${(m.comanda||[]).length} item(s) · há ${min} min</div></div>`
        : `<div style="margin-top:auto;color:var(--money);font-weight:700;font-size:14px">Livre</div>`}
    </div>`;
  }).join('');
  view.innerHTML=`
  <div class="scr-head">
    <button class="back" onclick="go('home')">Voltar<small>ESC</small></button>
    <div class="scr-title">Mesas</div>
    <div class="spacer"></div>
    ${mesas.length?`<button class="btn pri" onclick="addMesa()">+ Mesa</button>`:''}
  </div>
  <div style="padding:16px">
    ${mesas.length? `<div class="mesa-grid">${cards}</div>` :
      `<div class="ent-card" style="text-align:center;max-width:420px;margin:40px auto">
        <div style="color:var(--muted);margin-bottom:14px">Nenhuma mesa cadastrada ainda.</div>
        <button class="btn pri" onclick="criarMesasPadrao()">Criar mesas 1 a 8</button>
        <div style="margin-top:10px"><button class="btn gho" onclick="addMesa()">+ Adicionar uma mesa</button></div>
      </div>`}
  </div>`;
}
function criarMesasPadrao(){
  for(let n=1;n<=8;n++) db.mesas.push({id:uid(),nome:'Mesa '+n,comanda:[],aberta:false,abertaEm:null});
  store.save();renderMesas();toast('8 mesas criadas','good');
}
function addMesa(){
  openModal('Adicionar mesa',`
    <label class="fl" style="margin-top:0">Nome / número da mesa</label>
    <input class="finput" id="mesaNomeIn" placeholder="Ex.: Mesa 9 ou Varanda">
  `,()=>{
    const nome=$('#mesaNomeIn').value.trim();if(!nome){toast('Informe o nome','bad');return false;}
    db.mesas.push({id:uid(),nome,comanda:[],aberta:false,abertaEm:null});
    store.save();if(current==='mesas')renderMesas();toast('Mesa criada','good');
  });
}
function editMesa(id){
  const m=db.mesas.find(x=>x.id===id);if(!m)return;
  openModal('Editar mesa',`
    <label class="fl" style="margin-top:0">Nome / número</label>
    <input class="finput" id="mesaNomeIn" value="${esc(m.nome)}">
    ${(m.comanda||[]).length?`<p style="color:var(--muted);font-size:13px;margin:10px 0 0">Esta mesa tem uma comanda aberta com ${(m.comanda||[]).length} item(s).</p>`:''}
  `,()=>{
    const nome=$('#mesaNomeIn').value.trim();if(!nome){toast('Informe o nome','bad');return false;}
    m.nome=nome;store.save();renderMesas();toast('Mesa salva','good');
  },`<button class="btn dan" onclick="delMesa('${id}')">Excluir</button><div style="flex:1"></div><button class="cancel" onclick="closeModal()">Cancelar</button><button class="ok" onclick="doOk()">Confirmar</button>`);
}
function delMesa(id){
  const m=db.mesas.find(x=>x.id===id);
  if(m && (m.comanda||[]).length>0){toast('Feche a comanda antes de excluir a mesa','bad');return;}
  closeModal();
  confirmModal('Excluir mesa?','A mesa será removida da lista.',()=>{
    db.mesas=db.mesas.filter(x=>x.id!==id);store.save();renderMesas();toast('Mesa excluída');
  });
}

/* ============ CADASTRO DE PRODUTOS + ESTOQUE ============ */
let cadFiltro='', cadEstoque='todos';
function baixos(){return db.produtos.filter(p=>p.controla&&p.estoque>0&&p.estoque<=p.estoqueMin)}
function zerados(){return db.produtos.filter(p=>p.controla&&p.estoque<=0)}
function renderCadastro(){
  let prods=db.produtos.filter(p=>(p.nome+' '+(p.marca||'')+' '+(p.codigoBarras||'')).toLowerCase().includes(cadFiltro.toLowerCase()));
  if(cadEstoque==='baixo') prods=prods.filter(p=>p.controla&&p.estoque>0&&p.estoque<=p.estoqueMin);
  if(cadEstoque==='zero') prods=prods.filter(p=>p.controla&&p.estoque<=0);
  const nB=baixos().length, nZ=zerados().length;
  view.innerHTML=`
  <div class="scr-head">
    <button class="back" onclick="go('home')">Voltar<small>SHIFT + ESC</small></button>
    <div class="scr-title">Cadastro de Produtos</div>
    <div class="spacer"></div>
    <button class="btn gho" onclick="entradaEstoque()">Entrada de estoque</button>
    <button class="btn pri" onclick="editProduto()">Novo produto</button>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
    <button class="chip ${cadEstoque==='todos'?'on':''}" onclick="cadEstoque='todos';renderCadastro()">Todos (${db.produtos.length})</button>
    <button class="chip ${cadEstoque==='baixo'?'on':''}" onclick="cadEstoque='baixo';renderCadastro()">Estoque baixo ${nB?`<b>${nB}</b>`:''}</button>
    <button class="chip ${cadEstoque==='zero'?'on':''}" onclick="cadEstoque='zero';renderCadastro()">Sem estoque ${nZ?`<b>${nZ}</b>`:''}</button>
  </div>
  <input class="list-search" placeholder="Buscar por nome, marca ou código…" value="${esc(cadFiltro)}" oninput="cadFiltro=this.value;renderCadastro()">
  <div class="card"><table class="tbl"><thead><tr>
    <th>Produto</th><th>Marca</th><th>Peso/Un.</th><th class="right-num">Preço</th><th class="right-num">Estoque</th><th class="right-num">Ações</th>
  </tr></thead><tbody>
  ${prods.map(p=>{const s=stockInfo(p);return `<tr>
    <td><b>${esc(p.nome)}</b>${p.codigoBarras?`<br><span style="color:var(--faint);font-size:11px" class="mono">${esc(p.codigoBarras)}</span>`:''}</td>
    <td style="color:var(--muted)">${esc(p.marca||'—')}</td>
    <td style="color:var(--muted)">${esc(p.peso||'')} ${esc(p.unidade||'')}</td>
    <td class="right-num mono">${money(p.preco)}</td>
    <td class="right-num mono ${p.controla?s.cls:'faint'}">${p.controla?p.estoque:'—'}</td>
    <td class="right-num" style="white-space:nowrap">
      ${p.controla?`<button class="rowbtn" title="Entrada rápida" onclick="entradaRapida('${p.id}')">＋</button>`:''}
      <button class="rowbtn edit" title="Editar" onclick="editProduto('${p.id}')">✎</button>
      <button class="rowbtn del" title="Excluir" onclick="delProduto('${p.id}')">✕</button></td></tr>`}).join('')
    || '<tr><td colspan="6" style="text-align:center;color:var(--faint);padding:30px">Nenhum produto neste filtro</td></tr>'}
  </tbody></table></div>`;
}
function editProduto(id){
  const p=id?db.produtos.find(x=>x.id===id):null;
  const uni=['un','kg','g','L','ml','cx','pct','dz'];
  openModal(p?'Editar produto':'Novo produto',`
    <label class="fl">Nome do produto</label><input class="finput" id="pNome" value="${p?esc(p.nome):''}" placeholder="Ex.: Coca-Cola 2L">
    <div style="display:flex;gap:12px">
      <div style="flex:1"><label class="fl">Valor (R$)</label><input class="finput mono" id="pPreco" type="number" step="0.01" value="${p?p.preco:''}" placeholder="0,00"></div>
      <div style="flex:1"><label class="fl">Quantidade em estoque</label><input class="finput mono" id="pEst" type="number" step="1" value="${p?p.estoque:0}"></div>
      <div style="flex:1"><label class="fl">Estoque mínimo</label><input class="finput mono" id="pMin" type="number" step="1" value="${p?p.estoqueMin:5}"></div>
    </div>
    <div style="display:flex;gap:12px">
      <div style="flex:2"><label class="fl">Marca</label><input class="finput" id="pMarca" value="${p?esc(p.marca||''):''}" placeholder="Ex.: Nestlé"></div>
      <div style="flex:1"><label class="fl">Peso</label><input class="finput" id="pPeso" value="${p?esc(p.peso||''):''}" placeholder="Ex.: 500g"></div>
      <div style="flex:1"><label class="fl">Unidade</label><select class="sel" id="pUni" style="margin:0">${uni.map(u=>`<option ${p&&p.unidade===u?'selected':''}>${u}</option>`).join('')}</select></div>
    </div>
    <label class="fl">Código de barras</label><input class="finput mono" id="pCod" value="${p?esc(p.codigoBarras||''):''}" placeholder="opcional">
    <label style="display:flex;align-items:center;gap:10px;margin-top:6px;cursor:pointer;font-size:14px">
      <input type="checkbox" id="pCtrl" ${(!p||p.controla)?'checked':''} style="width:18px;height:18px">
      Controlar estoque <span style="color:var(--faint);font-size:12px">(desmarque p/ itens feitos na hora)</span>
    </label>
  `,()=>{
    const nome=$('#pNome').value.trim();const preco=parseFloat($('#pPreco').value);
    if(!nome||isNaN(preco)){toast('Preencha nome e valor','bad');return false;}
    const dados={nome,preco,estoque:parseInt($('#pEst').value)||0,estoqueMin:parseInt($('#pMin').value)||0,
      controla:$('#pCtrl').checked,marca:$('#pMarca').value.trim(),peso:$('#pPeso').value.trim(),
      unidade:$('#pUni').value,codigoBarras:$('#pCod').value.trim()};
    if(p){Object.assign(p,dados);
      // reflete no carrinho aberto (valor novo já sai na nota)
      cart.forEach(it=>{if(it.id===p.id){it.nome=p.nome;it.preco=p.preco;}});
    }else{db.produtos.push({id:uid(),...dados});}
    store.save();render();toast('Produto salvo','good');
  });
}
function delProduto(id){confirmModal('Excluir produto?','',()=>{db.produtos=db.produtos.filter(p=>p.id!==id);cart=cart.filter(i=>i.id!==id);store.save();render();toast('Produto excluído')})}
function entradaRapida(id){
  const p=db.produtos.find(x=>x.id===id);
  openModal('Entrada de estoque · '+p.nome,`
    <div style="color:var(--muted);font-size:13px;margin-bottom:10px">Estoque atual: <b class="mono">${p.estoque}</b></div>
    <label class="fl">Quantidade a adicionar</label>
    <input class="finput mono" id="entQtd" type="number" step="1" placeholder="0">
  `,()=>{
    const q=parseInt($('#entQtd').value);if(!q||q<=0){toast('Informe a quantidade','bad');return false;}
    p.estoque+=q;db.estoqueMov.unshift({data:agora(),produto:p.nome,tipo:'entrada',qtd:q,saldo:p.estoque});
    store.save();render();toast(`+${q} un. em ${p.nome}`,'good');
  });
}
function entradaEstoque(){
  openModal('Entrada de estoque',`
    <label class="fl">Produto</label>
    <select class="sel" id="entProd">${db.produtos.filter(p=>p.controla).map(p=>`<option value="${p.id}">${esc(p.nome)} (${p.estoque})</option>`).join('')}</select>
    <label class="fl">Quantidade a adicionar</label>
    <input class="finput mono" id="entQtd2" type="number" step="1" placeholder="0">
  `,()=>{
    const p=db.produtos.find(x=>x.id===$('#entProd').value);const q=parseInt($('#entQtd2').value);
    if(!p||!q||q<=0){toast('Selecione produto e quantidade','bad');return false;}
    p.estoque+=q;db.estoqueMov.unshift({data:agora(),produto:p.nome,tipo:'entrada',qtd:q,saldo:p.estoque});
    store.save();render();toast(`+${q} un. em ${p.nome}`,'good');
  });
}

/* ============ CONFIGURAÇÕES ============ */
function renderConfig(){
  view.innerHTML=`
  <div class="scr-head">
    <button class="back" onclick="go('home')">Voltar<small>SHIFT + ESC</small></button>
    <div class="scr-title">Configurações</div>
  </div>
  <div class="cfg-grid">
    <div class="cfg-card">
      <h3>Marca da loja</h3><p>Nome e sigla exibidos no topo do sistema — é o que o cliente vê como "a marca dele".</p>
      <label class="fl" style="margin-top:0">Nome da loja</label>
      <input class="finput" id="lojaNome" value="${esc(db.config.nomeLoja)}">
      <label class="fl">Sigla do topo (até 3 letras)</label>
      <input class="finput mono" id="lojaSigla" value="${esc(db.config.sigla||'RZ')}" maxlength="3" style="text-transform:uppercase">
      <button class="btn pri" style="margin-top:10px" onclick="salvarMarca()">Salvar marca</button>
    </div>
    <div class="cfg-card">
      <h3>Módulos ativos</h3><p>Ligue só o que esta conta usa. Reflete na tela inicial e no balcão.</p>
      <label style="display:flex;align-items:center;gap:10px;padding:9px 0;cursor:pointer">
        <input type="checkbox" ${db.config.modulos.entregas?'checked':''} onchange="toggleModulo('entregas',this.checked)" style="width:18px;height:18px;accent-color:var(--accent)">
        <span><b>Entregas</b> — motoboys, rotas e taxa de entrega</span>
      </label>
      <label style="display:flex;align-items:center;gap:10px;padding:9px 0;cursor:pointer">
        <input type="checkbox" ${db.config.modulos.mesas?'checked':''} onchange="toggleModulo('mesas',this.checked)" style="width:18px;height:18px;accent-color:var(--accent)">
        <span><b>Mesas / comandas</b> — abre, acumula itens e fecha num toque</span>
      </label>
    </div>
    <div class="cfg-card">
      <h3>Backup dos dados</h3><p>Exporte tudo para um arquivo JSON, ou restaure um backup.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn gho" onclick="exportJSON()">Exportar JSON</button>
        <button class="btn gho" onclick="document.getElementById('impFile').click()">Importar JSON</button>
        <input type="file" id="impFile" accept="application/json" style="display:none" onchange="importJSON(this)">
      </div>
      <button class="btn dan" style="margin-top:10px" onclick="resetTudo()">Restaurar dados de exemplo</button>
    </div>
    <div class="cfg-card">
      <h3>Produtos & estoque</h3><p>${db.produtos.length} produtos · ${baixos().length} com estoque baixo · ${zerados().length} sem estoque.</p>
      <button class="btn pri" onclick="go('cadastro')">Abrir cadastro de produtos</button>
    </div>
    <div class="cfg-card">
      <h3>Caixa</h3><p>Abre o fechamento de caixa do período.</p>
      <button class="btn gho" onclick="go('fechamento')">Abrir fechamento</button>
    </div>
  </div>`;
}
function salvarMarca(){
  db.config.nomeLoja=(document.getElementById('lojaNome').value.trim())||'Meu PDV';
  db.config.sigla=((document.getElementById('lojaSigla').value.trim())||'RZ').toUpperCase().slice(0,3);
  $('#brandName').textContent=db.config.nomeLoja;
  const bd=document.getElementById('brandDot'); if(bd) bd.textContent=db.config.sigla;
  store.save();toast('Marca salva','good');
}
function toggleModulo(nome,val){
  db.config.modulos[nome]=val;
  if(!db.config.modulos.entregas && canalAtual==='entrega') canalAtual='balcao';
  store.save();toast('Módulo '+(val?'ligado':'desligado')+': '+nome,'good');
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='backup-pdv-'+hoje().replace(/\//g,'-')+'.json';a.click();toast('Backup exportado','good');
}
function importJSON(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.produtos||!d.clientes)throw 0;db=migrate(d);store.save();toast('Backup restaurado','good');go('home');}
    catch(e){toast('Arquivo inválido','bad')}};r.readAsText(f);
}
function resetTudo(){confirmModal('Restaurar dados de exemplo?','Isso apaga tudo que você cadastrou.',()=>{db=seed();cart=[];store.save();$('#brandName').textContent=db.config.nomeLoja;go('home');toast('Dados restaurados')})}

/* ============ Modais ============ */
let modalConfirm=null;
function openModal(title,body,onOk,footHTML){
  modalConfirm=onOk;
  $('#modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-head">${title}<button class="x" onclick="closeModal()">✕</button></div>
      <div class="modal-body">${body}</div>
      <div class="modal-foot">${footHTML|| (onOk?`<button class="cancel" onclick="closeModal()">Cancelar</button><button class="ok" onclick="doOk()">Confirmar</button>`:`<button class="cancel" onclick="closeModal()" style="color:var(--accent)">Fechar</button>`)}</div>
    </div></div>`;
  setTimeout(()=>{const inp=$('#modal input');inp&&inp.focus()},50);
}
function doOk(){if(modalConfirm){const r=modalConfirm();if(r!==false)closeModal();}else closeModal();}
function closeModal(){$('#modal').innerHTML='';modalConfirm=null;}
function confirmModal(title,msg,onOk){
  openModal(title,`<p style="color:var(--muted);margin:0">${msg||'Tem certeza?'}</p>`,onOk);
}

/* ============ Atalhos de teclado ============ */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'){if(e.key==='Enter'&&modalConfirm)doOk();return;}
  const k=e.key.toLowerCase();
  if(current==='home'){
    if(k==='b')go('balcao');else if(k==='m'&&db.config.modulos.mesas)go('mesas');else if(k==='e')go('entregas');else if(k==='f')go('fechamento');else if(k==='c')go('credito');else if(k==='u')go('vendas');
    else if(k==='s')go('sangria');else if(k==='p')go('cadastro');else if(k==='ç'||k===';')go('config');
    else if(e.key==='F8')openClientePicker('atual');else if(e.key==='F9')trocarVendedor();
  }
  if(current==='balcao'&&e.key==='F2'&&cart.length){e.preventDefault();openPagamento();}
  if(e.key==='Escape'){if($('#modal').innerHTML)closeModal();else if(current!=='home')go('home');}
});

/* ============ Relógio ============ */
function tick(){const d=new Date();const p=n=>String(n).padStart(2,'0');
  $('#clkDate').textContent=`${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;
  $('#clkTime').textContent=`${p(d.getHours())}:${p(d.getMinutes())}`;}
tick();setInterval(tick,1000*20);

/* ============ Start ============ */
// Auth listener handles startup — see onAuthStateChanged above
showLoading('Conectando...');
</script>
